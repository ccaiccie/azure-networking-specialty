1:`<div class="implementation-lab"><h3>Implementation lab — ExpressRoute Direct MACsec</h3><p><strong>Goal:</strong> inspect the ExpressRoute Direct ports/links first, then configure MACsec on one link at a time. Replace all angle-bracket values with your resources. MACsec changes the Layer-2 protection of the Direct handoff; BGP rides above it.</p><pre class="impl"><code>az network express-route port show -g &lt;resource-group&gt; -n &lt;expressroute-port&gt;
az network express-route port link list -g &lt;resource-group&gt; --port-name &lt;expressroute-port&gt; -o table

# Inspect supported link/MACsec update options before changing production.
az network express-route port link update --help</code></pre><div class="verify"><strong>Verification:</strong> after applying the documented CAK/CKN/Key Vault configuration, use <code>az network express-route port link show</code> for each physical link and correlate with customer-router MACsec secure-channel counters. Change one redundant link at a time so the other remains a rollback path.</div></div>`,
2:`<div class="implementation-lab"><h3>Implementation lab — custom IPsec/IKE policy</h3><p><strong>Goal:</strong> apply an explicit proposal to an existing S2S VPN connection. The Azure and peer proposals must overlap exactly enough to negotiate Phase 1 and Phase 2.</p><pre class="impl"><code>az network vpn-connection ipsec-policy add \
  -g &lt;resource-group&gt; \
  --connection-name &lt;connection-name&gt; \
  --dh-group DHGroup14 \
  --ike-encryption AES256 \
  --ike-integrity SHA384 \
  --ipsec-encryption AES256 \
  --ipsec-integrity SHA256 \
  --pfs-group PFS2048 \
  --sa-lifetime 27000 \
  --sa-max-size 102400000

az network vpn-connection ipsec-policy list \
  -g &lt;resource-group&gt; --connection-name &lt;connection-name&gt; -o table</code></pre><div class="verify"><strong>Verification:</strong> confirm the Azure policy, then compare IKE/IPsec SA parameters on the on-premises firewall. If IKE is up but traffic is not, validate Phase-2 selectors and any NAT-translated prefixes separately from routing.</div></div>`,
3:`<div class="implementation-lab"><h3>Implementation lab — ExpressRoute Metro</h3><p><strong>Goal:</strong> discover supported ExpressRoute locations/providers and inspect the Metro circuit’s provisioning and BGP state. Metro availability is location/provider dependent, so discovery is part of implementation.</p><pre class="impl"><code>az network express-route list-service-providers -o table
az network express-route show -g &lt;resource-group&gt; -n &lt;metro-circuit&gt;
az network express-route peering list -g &lt;resource-group&gt; --circuit-name &lt;metro-circuit&gt; -o table</code></pre><div class="verify"><strong>Verification:</strong> prove that both diverse peering-site paths advertise the intended production prefixes and that either surviving path has sufficient capacity. A Metro resource alone does not prove carrier diversity between your premises and both Microsoft sites.</div></div>`,
4:`<div class="implementation-lab"><h3>Implementation lab — IPsec over ExpressRoute with Virtual WAN</h3><p><strong>Goal:</strong> configure/inspect the Virtual WAN VPN connection’s IPsec policy while using private transport for the VPN endpoints. Treat ExpressRoute reachability as the underlay and IPsec as a separate overlay.</p><pre class="impl"><code>az network vpn-gateway connection show \
  -g &lt;resource-group&gt; --gateway-name &lt;vwan-vpn-gateway&gt; \
  -n &lt;connection-name&gt;

az network vpn-gateway connection ipsec-policy list \
  -g &lt;resource-group&gt; --gateway-name &lt;vwan-vpn-gateway&gt; \
  --connection-name &lt;connection-name&gt;</code></pre><div class="verify"><strong>Verification:</strong> first prove the private VPN peer addresses are reachable over ExpressRoute, then prove the IKE/IPsec SAs, then verify decrypted application prefixes in Virtual WAN routing. This three-stage check distinguishes underlay, crypto, and post-decryption routing failures.</div></div>`,
5:`<div class="implementation-lab"><h3>Implementation lab — VNet peering gateway transit</h3><p><strong>Goal:</strong> create complementary peering settings: the hub advertises gateway transit and the spoke consumes the remote gateway.</p><pre class="impl"><code>az network vnet peering update \
  -g &lt;resource-group&gt; --vnet-name &lt;hub-vnet&gt; \

6:`<div class="implementation-lab"><h3>Implementation lab — Standard Load Balancer HA Ports</h3><p><strong>Goal:</strong> create an all-protocol, all-port rule for transit NVAs. Frontend and backend port 0 mean “any port” for an HA Ports rule.</p><pre class="impl"><code>az network lb rule create \
  -g &lt;resource-group&gt; --lb-name &lt;internal-lb&gt; \

  --frontend-port 0 --backend-port 0 \

7:`<div class="implementation-lab"><h3>Implementation lab — Azure Public DNS DNSSEC</h3><p><strong>Goal:</strong> inspect the public DNS zone and use the current Microsoft DNSSEC workflow to enable signing, then publish the resulting DS records at the parent registrar. Because DNSSEC commands evolve, discover the current CLI surface before changing a production zone.</p><pre class="impl"><code>az network dns zone show -g &lt;resource-group&gt; -n &lt;zone-name&gt;

8:`<div class="implementation-lab"><h3>Implementation lab — Front Door Premium Private Link origin</h3><p><strong>Goal:</strong> add a private-link-enabled origin to a Front Door Premium origin group. The private endpoint request must then be approved on the origin resource.</p><pre class="impl"><code>az afd origin-group create \
  -g &lt;resource-group&gt; --profile-name &lt;afd-profile&gt; \
  --origin-group-name &lt;origin-group&gt; \
  --probe-request-type GET --probe-protocol Https \
  --probe-path / --probe-interval-in-seconds 60

az afd origin create \
  -g &lt;resource-group&gt; --profile-name &lt;afd-profile&gt; \

  --host-name &lt;origin-fqdn&gt; --origin-host-header &lt;origin-fqdn&gt; \
  --https-port 443 --enable-private-link true \
  --private-link-location &lt;region&gt; \
  --private-link-resource &lt;origin-resource-id&gt; \
  --private-link-sub-resource-type &lt;subresource&gt;</code></pre><div class="verify"><strong>Verification:</strong> approve the pending private endpoint request on the origin, then check Front Door origin health. Until approval/establishment completes, Front Door cannot reach the origin privately even though the profile and route exist.</div></div>`,
9:`<div class="implementation-lab"><h3>Implementation lab — Azure Firewall Premium TLS inspection</h3><p><strong>Goal:</strong> inspect the Premium firewall policy and its certificate/trust configuration before enabling TLS inspection on application rules. The certificate authority lifecycle is part of the network design.</p><pre class="impl"><code>az network firewall policy show \
  -g &lt;resource-group&gt; -n &lt;firewall-policy&gt; -o jsonc

az network firewall policy rule-collection-group list \
  -g &lt;resource-group&gt; --policy-name &lt;firewall-policy&gt; -o table</code></pre><div class="verify"><strong>Verification:</strong> validate that client devices trust the enterprise CA used by Firewall Premium, then test an allowed HTTPS destination and inspect firewall logs/IDPS telemetry. If TLS breaks while TCP/443 is reachable, investigate certificate trust/SNI/application rules rather than routing first.</div></div>`,
10:`<div class="implementation-lab"><h3>Implementation lab — VNet Flow Logs + Traffic Analytics</h3><p><strong>Goal:</strong> create a Log Analytics workspace and a VNet-scoped flow log that sends records to storage and Traffic Analytics.</p><pre class="impl"><code>az monitor log-analytics workspace create \
  -g &lt;resource-group&gt; -n &lt;workspace&gt; -l &lt;region&gt;

az network watcher flow-log create \
  --location &lt;region&gt; --resource-group &lt;resource-group&gt; \
  --name &lt;flow-log-name&gt; --vnet &lt;vnet-name&gt; \
  --storage-account &lt;storage-account&gt; \
  --traffic-analytics true --workspace &lt;workspace&gt; --interval 10

az network watcher flow-log show \
  --location &lt;region&gt; --resource-group &lt;resource-group&gt; \
  --name &lt;flow-log-name&gt;</code></pre><div class="verify"><strong>Verification:</strong> confirm the flow-log resource is enabled, storage is receiving records, and Traffic Analytics data appears after ingestion delay. Flow logs describe observed Layer-4 flows; they do not replace packet capture when payload/handshake details are needed.</div></div>`,
11:`<div class="implementation-lab"><h3>Implementation lab — Network Watcher IP Flow Verify</h3><p><strong>Goal:</strong> ask Azure which NSG rule would allow or deny one precise five-tuple. This is a diagnostic command, not a synthetic application transaction.</p><pre class="impl"><code>az network watcher test-ip-flow \
  -g &lt;resource-group&gt; --vm &lt;vm-name&gt; \
  --direction Inbound --protocol TCP \
  --local &lt;vm-private-ip&gt;:443 \
  --remote &lt;client-ip&gt;:50000

az network nic show-effective-nsg \
  -g &lt;resource-group&gt; -n &lt;vm-nic&gt;</code></pre><div class="verify"><strong>Verification:</strong> record both the Access result and the rule name returned by IP Flow Verify. If it says Allow but the application still fails, move to routing, guest firewall/listener, load balancer, DNS, or application diagnostics instead of continuing to edit NSGs.</div></div>`,
12:`<div class="implementation-lab"><h3>Implementation lab — Azure Private Link Service</h3><p><strong>Goal:</strong> publish the frontend of an internal Standard Load Balancer as a Private Link Service, then inspect consumer connection requests.</p><pre class="impl"><code>az network private-link-service create \
  -g &lt;resource-group&gt; -n &lt;pls-name&gt; \
  --vnet-name &lt;provider-vnet&gt; --subnet &lt;pls-subnet&gt; \
  --lb-frontend-ip-configs &lt;load-balancer-frontend-resource-id&gt; \
  --location &lt;region&gt;

az network private-link-service show \
  -g &lt;resource-group&gt; -n &lt;pls-name&gt;
az network private-link-service connection list \

    /Build the first version in the Azure portal if visual confirmation helps, then express repeatable production state in CLI, PowerShell, Bicep, or Terraform where the service supports it\. ?/g,

    /A correct route can still be denied by an NSG or firewall; a permissive security rule cannot repair a missing route; a successful DNS lookup does not prove the backend data path; and a healthy control-plane adjacency does not prove application state\. ?/g,
    /Where stateful inspection exists, validate forward and return symmetry\. ?/g,
    /Where redundancy exists, verify that the surviving path has enough capacity and correct policy to carry production load rather than merely checking that the resource is present\. ?/g,
