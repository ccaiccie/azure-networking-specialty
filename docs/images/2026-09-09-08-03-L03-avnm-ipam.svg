<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078d4"/></marker></defs><rect width="1400" height="620" fill="#f7fbff"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#16324f">AVNM IPAM: hierarchical pools and non-overlapping VNet allocation</text><g font-family="Segoe UI,Arial" font-size="21" font-weight="600" text-anchor="middle"><rect x="70" y="250" width="220" height="90" rx="18" fill="#e8f1fb" stroke="#0078d4" stroke-width="3"/><text x="180" y="305">Enterprise root pool</text><rect x="390" y="120" width="220" height="90" rx="18" fill="#ddeaff" stroke="#005a9e" stroke-width="3"/><text x="500" y="175">Region child pool</text><rect x="390" y="380" width="220" height="90" rx="18" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="500" y="435">Prod child pool</text><rect x="790" y="120" width="220" height="90" rx="18" fill="#dff6dd" stroke="#107c10" stroke-width="3"/><text x="900" y="175">VNet allocation</text><rect x="790" y="380" width="250" height="90" rx="18" fill="#fce8e6" stroke="#c50f1f" stroke-width="3"/><text x="915" y="435">Static CIDR reservation</text></g><g fill="none" stroke="#0078d4" stroke-width="6" marker-end="url(#a)"><path d="M290 295 C340 295 340 165 390 165"/><path d="M290 295 C340 295 340 425 390 425"/><path d="M610 165 H790"/><path d="M610 425 H790"/></g><text x="700" y="145" font-family="Segoe UI,Arial" font-size="18" fill="#43566b">automatic allocation</text><text x="690" y="405" font-family="Segoe UI,Arial" font-size="18" fill="#43566b">reserve external use</text><rect x="70" y="525" width="1170" height="54" rx="12" fill="#eef7fd" stroke="#9ac7e8"/><text x="655" y="558" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#24445f">IPAM governs address allocation; normal Azure routing begins after the VNet receives its CIDR.</text></svg>