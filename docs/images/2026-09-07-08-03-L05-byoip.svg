<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Bring Your Own IP: prove ownership, commission the custom prefix, then derive Azure public prefixes</text><rect x="60" y="150" width="235" height="100" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="178" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Customer IP range</text><text x="178" y="220" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#244062">RIR ownership + ROA</text><rect x="360" y="120" width="350" height="160" rx="12" fill="#0078d4"/><text x="535" y="162" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Azure Custom IP Prefix</text><text x="535" y="195" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Validate → Provision</text><text x="535" y="225" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Commission → Microsoft advertises</text><text x="535" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="white">ASN 8075</text><rect x="790" y="150" width="230" height="100" rx="12" fill="#50e6ff" stroke="#0078d4" stroke-width="2"/><text x="905" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#073b66">Public IP Prefix</text><text x="905" y="220" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#073b66">Derived child resource</text><rect x="1090" y="150" width="250" height="100" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1215" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#0b5a23">Azure service</text><text x="1215" y="220" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#0b5a23">Public IP / Load Balancer</text><path d="M295 200 H350" stroke="#44546a" stroke-width="4"/><path d="M710 200 H780" stroke="#44546a" stroke-width="4"/><path d="M1020 200 H1080" stroke="#44546a" stroke-width="4"/><rect x="360" y="340" width="660" height="46" rx="8" fill="#fff2f2" stroke="#a4262c"/><text x="690" y="369" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#8a1c1c">Do not keep advertising the same prefix externally during Azure commissioning; avoid asymmetric or conflicting BGP origin.</text></svg>