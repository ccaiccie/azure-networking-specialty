<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5C6BC0"/></marker></defs><rect width="1200" height="520" fill="#f7fbff"/><text x="600" y="42" text-anchor="middle" font-family="Segoe UI" font-size="27" font-weight="700" fill="#073b66">Custom IPsec/IKE Policy</text><rect x="70" y="220" rx="18" width="210" height="90" fill="#ffe6cc" stroke="#d79b00" stroke-width="3"/><text x="175" y="258" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">On-premises VPN</text><text x="175" y="283" text-anchor="middle" font-family="Segoe UI" font-size="15">Peer device</text><rect x="430" y="190" rx="18" width="210" height="150" fill="#dae8fc" stroke="#0078D4" stroke-width="4"/><circle cx="535" cy="235" r="30" fill="#0078D4"/><text x="535" y="243" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700" fill="white">VPN</text><text x="535" y="292" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Azure VPN Gateway</text><rect x="800" y="220" rx="18" width="220" height="90" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="910" y="258" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Azure VNet</text><text x="910" y="283" text-anchor="middle" font-family="Segoe UI" font-size="14">Workload subnets</text><rect x="360" y="62" rx="15" width="350" height="90" fill="#e1d5e7" stroke="#9673a6" stroke-width="3"/><text x="535" y="95" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="700">Policy agreement must match both peers</text><text x="535" y="121" text-anchor="middle" font-family="Segoe UI" font-size="13">IKE / IPsec algorithms · DH/PFS · SA lifetimes</text><line x1="280" y1="265" x2="430" y2="265" stroke="#5C6BC0" stroke-width="5" marker-end="url(#m)"/><text x="355" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14">IKE → IPsec SA</text><line x1="640" y1="265" x2="800" y2="265" stroke="#43A047" stroke-width="4" marker-end="url(#m)"/><text x="720" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14">Routed payload</text><line x1="535" y1="152" x2="535" y2="190" stroke="#9673a6" stroke-width="3" stroke-dasharray="7 5"/><text x="600" y="420" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#536779">A custom policy is negotiated per connection; mismatched transforms commonly prevent IKE or Child SA establishment.</text></svg>