<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078D4"/></marker></defs><rect width="1200" height="520" fill="#f7fbff"/><text x="600" y="42" text-anchor="middle" font-family="Segoe UI" font-size="27" font-weight="700" fill="#073b66">Azure Public DNS — DNSSEC Chain of Trust</text><rect x="70" y="235" rx="18" width="190" height="90" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="165" y="272" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Validating Resolver</text><text x="165" y="297" text-anchor="middle" font-family="Segoe UI" font-size="14">Client-side recursion</text><rect x="380" y="85" rx="18" width="190" height="90" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="475" y="122" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Parent Zone</text><text x="475" y="147" text-anchor="middle" font-family="Segoe UI" font-size="14">DS record</text><rect x="470" y="235" rx="18" width="230" height="100" fill="#dae8fc" stroke="#0078D4" stroke-width="4"/><text x="585" y="273" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Azure Public DNS</text><text x="585" y="298" text-anchor="middle" font-family="Segoe UI" font-size="14">DNSSEC-signed zone</text><rect x="820" y="235" rx="18" width="260" height="100" fill="#e1d5e7" stroke="#9673a6" stroke-width="3"/><text x="950" y="270" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="700">Signed DNS records</text><text x="950" y="296" text-anchor="middle" font-family="Segoe UI" font-size="14">DNSKEY · RRSIG · NSEC/NSEC3</text><line x1="260" y1="280" x2="470" y2="280" stroke="#0078D4" stroke-width="4" marker-end="url(#m)"/><line x1="570" y1="175" x2="585" y2="235" stroke="#F57C00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#m)"/><line x1="700" y1="285" x2="820" y2="285" stroke="#43A047" stroke-width="4" marker-end="url(#m)"/><text x="600" y="445" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#536779">Signing the Azure zone is only half the chain: publish the generated DS record in the signed parent zone so validators can authenticate the delegation.</text></svg>