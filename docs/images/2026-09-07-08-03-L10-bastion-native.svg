<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Azure Bastion native client: management reaches private VMs through Bastion while NSGs constrain the service path</text><rect x="55" y="145" width="250" height="110" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="180" y="188" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Admin workstation</text><text x="180" y="218" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#244062">Azure CLI + SSH/RDP</text><rect x="390" y="120" width="330" height="160" rx="12" fill="#0078d4"/><text x="555" y="162" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Azure Bastion</text><text x="555" y="193" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Standard / Premium</text><text x="555" y="223" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">Native Client Support + tunnel</text><text x="555" y="250" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="white">No public IP on target VM</text><rect x="795" y="105" width="345" height="190" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="968" y="145" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#5b4a00">AzureBastionSubnet NSG</text><text x="968" y="177" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Inbound 443 / GatewayManager</text><text x="968" y="205" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">VNet 8080,5701 / Azure LB</text><text x="968" y="233" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Outbound VNet 22,3389</text><text x="968" y="260" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#5b4a00">Target subnet permits source AzureBastionSubnet</text><rect x="1205" y="145" width="165" height="110" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1288" y="188" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#0b5a23">Private VM</text><text x="1288" y="218" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#0b5a23">22 / 3389</text><path d="M305 200 H380" stroke="#4472c4" stroke-width="4"/><path d="M720 200 H785" stroke="#d39e00" stroke-width="4"/><path d="M1140 200 H1195" stroke="#107c10" stroke-width="4"/><rect x="410" y="350" width="580" height="44" rx="8" fill="#fff2f2" stroke="#a4262c"/><text x="700" y="378" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#8a1c1c">Native-client sessions are not the same as browser sessions; Premium session recording does not record native-client connections.</text></svg>