<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Azure Front Door caching: edge cache serves GET responses without returning to the origin on every request</text><rect x="65" y="150" width="220" height="100" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="175" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Internet client</text><text x="175" y="220" text-anchor="middle" font-family="Consolas" font-size="14" fill="#244062">GET /asset.js</text><rect x="390" y="130" width="300" height="140" rx="12" fill="#0078d4"/><text x="540" y="172" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Front Door POP</text><text x="540" y="202" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Route + cache configuration</text><text x="540" y="232" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">Rules Engine can override</text><rect x="790" y="120" width="320" height="160" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="950" y="158" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#5b4a00">Edge cache decision</text><text x="950" y="190" text-anchor="middle" font-family="Consolas" font-size="15" fill="#5b4a00">TCP_HIT / TCP_MISS</text><text x="950" y="218" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Cache-Control + query behavior</text><text x="950" y="246" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">8-MB chunking for large files</text><rect x="1190" y="150" width="170" height="100" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1275" y="192" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#0b5a23">Origin</text><text x="1275" y="220" t