<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078D4"/></marker></defs><rect width="1250" height="520" fill="#f7fbff"/><text x="625" y="42" text-anchor="middle" font-family="Segoe UI" font-size="27" font-weight="700" fill="#073b66">IPsec over ExpressRoute with Azure Virtual WAN</text><rect x="50" y="220" rx="18" width="190" height="90" fill="#ffe6cc" stroke="#d79b00" stroke-width="3"/><text x="145" y="257" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">On-prem VPN</text><rect x="330" y="220" rx="18" width="210" height="90" fill="#dae8fc" stroke="#0078D4" stroke-width="4"/><text x="435" y="252" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">ExpressRoute</text><text x="435" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14">Private peering</text><rect x="650" y="180" rx="18" width="230" height="170" fill="#e1d5e7" stroke="#9673a6" stroke-width="4"/><text x="765" y="218" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Virtual WAN Hub</text><rect x="690" y="245" rx="12" width="150" height="65" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="765" y="274" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="700">VPN Gateway</text><text x="765" y="296" text-anchor="middle" font-family="Segoe UI" font-size="12">Private gateway IP</text><rect x="1000" y="220" rx="18" width="190" height="90" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="1095" y="257" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Connected VNets</text><line x1="240" y1="265" x2="330" y2="265" stroke="#0078D4" stroke-width="5" marker-end="url(#m)"/><line x1="540" y1="265" x2="650" y2="265" stroke="#0078D4" stroke-width="5" marker-end="url(#m)"/><line x1="880" y1="265" x2="1000" y2="265" stroke="#43A047" stroke-width="4" marker-end="url(#m)"/><path d="M145 220 C300 80 620 80 765 245" fill="none" stroke="#5C6BC0" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#m)"/><text x="450" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5C6BC0">IPsec/IKE tunnel rides over ExpressRoute private reachability</text><text x="625" y="450" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#536779">The underlay is ExpressRoute; confidentiality comes from the overlay IPsec tunnel to the hub VPN gateway private IP.</text></svg>