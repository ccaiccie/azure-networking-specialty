<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#3b6ea8"/></marker></defs><rect width="1240" height="330" fill="#f8fbfd"/><text x="35" y="45" font-family="Segoe UI" font-size="23" fill="#0a3558">Load Balancer administrative state and health-probe override</text><rect x="40" y="110" width="220" height="90" rx="14" fill="#e6f2ff" stroke="#0078d4"/><rect x="340" y="70" width="220" height="75" rx="14" fill="#fff4ce" stroke="#0078d4"/><rect x="640" y="110" width="220" height="90" rx="14" fill="#ffe6e6" stroke="#a4262c"/><rect x="940" y="110" width="220" height="90" rx="14" fill="#e9f7ef" stroke="#107c41"/><g font-family="Segoe UI" font-size="15" text-anchor="middle" fill="#17324d"><text x="150" y="158">Load Balancer Rule</text><text x="450" y="113">Health Probe Signal</text><text x="750" y="150">Admin State</text><text x="750" y="173">Up / Down / None</text><text x="1050" y="158">Backend Instance</text></g><path d="M260 155 C390 155 500 155 640 155" fill="none" stroke="#3b6ea8" stroke-width="4" marker-end="url(#a)"/><path d="M560 108 C600 110 615 125 640 140" fill="none" stroke="#d98500" stroke-width="4" marker-end="url(#a)"/><path d="M860 155 C890 120 910 120 940 155" fill="none" stroke="#107c41" stroke-width="4" marker-end="url(#a)"/><text x="35" y="285" font-family="Segoe UI" font-size="13" fill="#5b6d7d">Down removes a backend from new-flow eligibility; Up can override a failed probe; None restores normal probe behavior.</text></svg>