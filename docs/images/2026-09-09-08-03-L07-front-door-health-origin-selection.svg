<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078d4"/></marker></defs><rect width="1400" height="620" fill="#f7fbff"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#16324f">Front Door origin selection: health first, then priority, latency, weight, and affinity</text><g font-family="Segoe UI,Arial" font-size="21" font-weight="600" text-anchor="middle"><rect x="60" y="260" width="160" height="90" rx="18" fill="#e8f1fb" stroke="#0078d4" stroke-width="3"/><text x="140" y="315">Clients</text><rect x="330" y="260" width="210" height="90" rx="18" fill="#ddeaff" stroke="#005a9e" stroke-width="3"/><text x="435" y="315">Front Door edge</text><rect x="650" y="260" width="270" height="90" rx="18" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="785" y="315">Probe samples + routing</text><rect x="1040" y="130" width="220" height="90" rx="18" fill="#dff6dd" stroke="#107c10" stroke-width="3"/><text x="1150" y="185">Origin A healthy</text><rect x="1040" y="390" width="220" height="90" rx="18" fill="#eadcf8" stroke="#8661c5" stroke-width="3"/><text x="1150" y="445">Origin B standby</text></g><g fill="none" stroke="#0078d4" stroke-width="6" marker-end="url(#a)"><path d="M220 305 H330"/><path d="M540 305 H650"/><path d="M920 305 C980 305 980 175 1040 175"/><path d="M920 305 C980 305 980 435 1040 435"/></g><rect x="60" y="520" width="1200" height="58" rx="12" fill="#eef7fd" stroke="#9ac7e8"/><text x="660" y="556" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#24445f">A 200 probe response determines eligibility; only eligible origins proceed into the ordered routing algorithm.</text></svg>