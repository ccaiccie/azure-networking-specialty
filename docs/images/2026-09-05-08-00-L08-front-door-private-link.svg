<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078D4"/></marker></defs><rect width="1200" height="520" fill="#f7fbff"/><text x="600" y="42" text-anchor="middle" font-family="Segoe UI" font-size="27" font-weight="700" fill="#073b66">Azure Front Door Premium → Private Link Origin</text><rect x="60" y="225" rx="18" width="180" height="90" fill="#ffe6cc" stroke="#d79b00" stroke-width="3"/><text x="150" y="278" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Internet Clients</text><rect x="340" y="190" rx="18" width="230" height="160" fill="#dae8fc" stroke="#0078D4" stroke-width="4"/><text x="455" y="228" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700">Front Door Premium</text><text x="455" y="256" text-anchor="middle" font-family="Segoe UI" font-size="14">Global POP + WAF/routing</text><text x="455" y="284" text-anchor="middle" font-family="Segoe UI" font-size="14">Regional managed network</text><rect x="680" y="220" rx="18" width="210" height="100" fill="#e1d5e7" stroke="#9673a6" stroke-width="3"/><text x="785" y="258" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="700">Private Endpoint</text><text x="785" y="284" text-anchor="middle" font-family="Segoe UI" font-size="14">Created by Front Door</text><rect x="980" y="220" rx="18" width="170" height="100" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="1065" y="258" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="700">Private Origin</text><text x="1065" y="284" text-anchor="middle" font-family="Segoe UI" font-size="13">App / Storage / APIM</text><line x1="240" y1="270" x2="340" y2="270" stroke="#0078D4" stroke-width="5" marker-end="url(#m)"/><line x1="570" y1="270" x2="680" y2="270" stroke="#5C6BC0" stroke-width="5" marker-end="url(#m)"/><line x1="890" y1="270" x2="980" y2="270" stroke="#43A047" stroke-width="5" marker-end="url(#m)"/><text x="600" y="445" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#536779">Clients stay public to Front Door; the origin hop becomes private after the origin owner approves the private endpoint request.</text></svg>