<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">ExpressRoute gateway migration to availability-zone-enabled SKU</title><desc id="d">On-premises connects through an ExpressRoute circuit to old and new virtual network gateways during staged migration, then to an Azure VNet.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker></defs><rect width="1400" height="620" fill="#f7fbff"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#16324f">ExpressRoute gateway migration: Validate → Prepare → Migrate → Commit</text><g font-family="Segoe UI,Arial" font-size="22" font-weight="600" text-anchor="middle"><rect x="60" y="250" width="180" height="95" rx="18" fill="#e8f1fb" stroke="#0078d4" stroke-width="3"/><text x="150" y="305" fill="#17324d">On-premises</text><rect x="320" y="250" width="210" height="95" rx="18" fill="#ddeaff" stroke="#005a9e" stroke-width="3"/><text x="425" y="305" fill="#17324d">ExpressRoute circuit</text><rect x="610" y="135" width="220" height="95" rx="18" fill="#ffe7c2" stroke="#d17a00" stroke-width="3"/><text x="720" y="190" fill="#5e3a00">Old ER gateway</text><rect x="610" y="365" width="250" height="95" rx="18" fill="#dff6dd" stroke="#107c10" stroke-width="3"/><text x="735" y="420" fill="#0d5f0d">New Az-enabled gateway</text><rect x="1010" y="250" width="210" height="95" rx="18" fill="#eadcf8" stroke="#8661c5" stroke-width="3"/><text x="1115" y="305" fill="#513c78">Azure VNet</text></g><g fill="none" stroke="#0078d4" stroke-width="6" marker-end="url(#a)"><path d="M240 298 H320"/><path d="M530 298 C570 298 570 182 610 182"/><path d="M530 298 C570 298 570 412 610 412"/><path d="M830 182 C920 182 920 298 1010 298"/><path d="M860 412 C930 412 930 298 1010 298"/></g><g font-family="Segoe UI,Arial" font-size="18" fill="#43566b"><text x="565" y="155">current</text><text x="555" y="455">prepare / validate</text><text x="900" y="390">traffic cutover</text></g><rect x="60" y="515" width="1160" height="60" rx="12" fill="#eef7fd" stroke="#9ac7e8"/><text x="640" y="552" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#24445f">Keep the old gateway until the new Az-enabled gateway has clean connection state, BGP, metrics, and application tests.</text></svg>