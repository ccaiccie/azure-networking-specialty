<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Standard Load Balancer outbound rules: make SNAT identity and port allocation explicit</text><rect x="65" y="150" width="230" height="100" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="180" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Backend VMs</text><text x="180" y="220" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#244062">Private source IPs</text><rect x="390" y="125" width="320" height="150" rx="12" fill="#0078d4"/><text x="550" y="168" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Standard Load Balancer</text><text x="550" y="198" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Outbound rule</text><text x="550" y="228" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">SNAT port allocation + idle timeout</text><rect x="800" y="140" width="290" height="120" rx="12" fill="#50e6ff" stroke="#0078d4" stroke-width="2"/><text x="945" y="183" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#073b66">Frontend public IP/prefix</text><text x="945" y="213" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#073b66">~64K SNAT ports / IP</text><text x="945" y="238" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#073b66">TCP/UDP only</text><rect x="1170" y="150" width="180" height="100" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1260" y="192" text-anchor="middle" font-family="Segoe UI" font-size="19" fill="#0b5a23">Internet</text><text x="1260" y="220" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#0b5a23">Remote service</text><path d="M295 200 H380" stroke="#4472c4" stroke-width="4"/><p