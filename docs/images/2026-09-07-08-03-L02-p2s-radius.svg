<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44546a"/></marker></defs><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Point-to-Site VPN with RADIUS: authentication is a separate control path</text><rect x="60" y="150" width="220" height="100" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="170" y="188" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="#244062">Remote user</text><text x="170" y="217" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#244062">OpenVPN / IKEv2 client</text><rect x="400" y="130" width="280" height="140" rx="12" fill="#0078d4"/><text x="540" y="176" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Azure VPN Gateway</text><text x="540" y="206" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">P2S tunnel termination</text><text x="540" y="236" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">RADIUS client</text><rect x="790" y="92" width="240" height="86" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="910" y="132" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#5b4a00">RADIUS primary</text><text x="910" y="157" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Access-Accept / Reject</text><rect x="790" y="228" width="240" height="86" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="910" y="268" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#5b4a00">RADIUS secondary</text><text x="910" y="293" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Authentication HA</text><rect x="1110" y="150" width="230" height="100" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1225" y="188" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="#0b5a23">Azure workloads</text><text x="1225" y="217" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#0b5a23">Private VNet routes</text><line x1="280" y1="200" x2="390" y2="200" stroke="#4472c4" stroke-width="4" marker-end="url(#m)"/><text x="335" y="185" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#244062">VPN tunnel</text><line x1="680" y1="175" x2="780" y2="135" stroke="#d83b01" stroke-width="4" marker-end="url(#m)"/><line x1="680" y1="225" x2="780" y2="270" stroke="#d83b01" stroke-width="4" marker-end="url(#m)"/><text x="730" y="115" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#8a2700">RADIUS control</text><line x1="680" y1="200" x2="1100" y2="200" stroke="#107c10" stroke-width="4" marker-end="url(#m)"/><text x="890" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#0b5a23">authenticated user data</text><rect x="370" y="340" width="650" height="50" rx="8" fill="#fff2f2" stroke="#a4262c"/><text x="695" y="371" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#8a1c1c">If the gateway cannot reach RADIUS, users fail authentication even when VPN gateway provisioning is healthy.</text></svg>