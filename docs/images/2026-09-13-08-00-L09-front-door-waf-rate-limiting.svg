<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#3b6ea8"/></marker></defs><rect width="1240" height="330" fill="#f8fbfd"/><text x="35" y="45" font-family="Segoe UI" font-size="23" fill="#0a3558">Front Door WAF fixed-window rate limiting</text><g font-family="Segoe UI" font-size="15" text-anchor="middle"><rect x="40" y="110" width="230" height="90" rx="14" fill="#e6f2ff" stroke="#0078d4"/><text x="155" y="158">Client Socket IP</text><rect x="340" y="110" width="230" height="90" rx="14" fill="#fff4ce" stroke="#0078d4"/><text x="455" y="158">Front Door Edge</text><rect x="640" y="110" width="230" height="90" rx="14" fill="#ffe6e6" stroke="#a4262c"/><text x="755" y="150">WAF RateLimitRule</text><text x="755" y="173">fixed window counter</text><rect x="940" y="110" width="230" height="90" rx="14" fill="#e9f7ef" stroke="#107c41"/><text x="1055" y="150">Allowed -> Origin</text><text x="1055" y="173">Over limit -> Block</text></g><g stroke="#3b6ea8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M270 155 C295 120 315 120 340 155"/><path d="M570 155 C595 120 615 120 640 155"/><path d="M870 155 C895 120 915 120 940 155"/></g><text x="35" y="285" font-family="Segoe UI" font-size="13" fill="#5b6d7d">Match scope and client-IP aggregation are as important as the threshold; blocked requests never reach the origin.</text></svg>