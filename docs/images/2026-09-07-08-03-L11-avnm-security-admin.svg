<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Virtual Network Manager security admin rules: central guardrails are evaluated before workload NSGs</text><rect x="60" y="125" width="330" height="150" rx="12" fill="#0078d4"/><text x="225" y="168" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Virtual Network Manager</text><text x="225" y="200" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Security admin configuration</text><text x="225" y="230" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">Regional deployment</text><rect x="480" y="115" width="330" height="170" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="645" y="156" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#5b4a00">Admin rule collection</text><text x="645" y="188" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Allow • AlwaysAllow • Deny</text><text x="645" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Priority 1–4096</text><text x="645" y="244" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#5b4a00">Applied to network groups</text><rect x="900" y="90" width="330" height="105" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1065" y="132" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#0b5a23">Target VNets / network group</text><text x="1065" y="162" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#0b5a23">Central decision first</text><rect x="900" y="245" width="330" height="105" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="1065" y="287" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Workload NSGs</text><text x="1065" y="317" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#244062">Evaluated after normal Allow</text><path d="M390 200 H470" stroke="#0078d4" stroke-width="4"/><path d="M810 180 H890" stroke="#107c10" stroke-width="4"/><path d="M1065 195 V235" stroke="#4472c4" stroke-width="4"/><rect x="300" y="370" width="800" height="42" rx="8" fill="#fff2f2" stroke="#a4262c"/><text x="700" y="397" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#8a1c1c">An AlwaysAllow admin rule bypasses NSG evaluation for the matching flow; use it sparingly because app teams cannot override it locally.</text></svg>