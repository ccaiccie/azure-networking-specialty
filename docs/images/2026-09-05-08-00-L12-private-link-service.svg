" y2="270" stroke="#0078D4" stroke-width="5" marker-end="url(#m)"/><line x1="920" y1="270" x2="1000" y2="270" stroke="#43A047" stroke-width="5" marker-end="url(#m)"/><text x="600" y="455" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#536779">Consumers connect privately from their VNets; the provider exposes only the Standard Load Balancer frontend through the Private Link Service.</text></svg>