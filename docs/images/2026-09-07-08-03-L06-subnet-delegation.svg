<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Subnet delegation: grant a specific Azure service permission to manage subnet-dependent configuration</text><rect x="70" y="105" width="380" height="220" rx="14" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="100" y="140" font-family="Segoe UI" font-size="20" font-weight="700" fill="#244062">Virtual Network</text><rect x="130" y="175" width="260" height="105" rx="10" fill="#50e6ff" stroke="#0078d4" stroke-width="2"/><text x="260" y="215" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#073b66">Delegated subnet</text><text x="260" y="245" text-anchor="middle" font-family="Consolas" font-size="15" fill="#073b66">Microsoft.Web/serverFarms</text><rect x="550" y="155" width="310" height="125" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="705" y="195" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#5b4a00">Delegation contract</text><text x="705" y="225" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Service-specific actions only</text><text x="705" y="252" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Not general administrative control</text><rect x="1010" y="155" width="300" height="125" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1160" y="198" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#0b5a23">Delegated Azure service</text><text x="1160" y="228" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#0b5a23">Deploys service resources</text><text x="1160" y="253" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#0b5a23">inside/against subnet</text><path d="M450 220 H540" stroke="#0078d4" stroke-width="4"/><path d="M860 220 H1000" stroke="#107c10" stroke-width="4"/></svg>