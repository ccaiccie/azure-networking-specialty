<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078d4"/></marker></defs><rect width="1400" height="620" fill="#f7fbff"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#16324f">Network Watcher VPN troubleshoot: on-demand managed diagnostics</text><g font-family="Segoe UI,Arial" font-size="21" font-weight="600" text-anchor="middle"><rect x="60" y="260" width="210" height="90" rx="18" fill="#e8f1fb" stroke="#0078d4" stroke-width="3"/><text x="165" y="315">Network Watcher</text><rect x="380" y="135" width="210" height="90" rx="18" fill="#ddeaff" stroke="#005a9e" stroke-width="3"/><text x="485" y="190">VPN Gateway</text><rect x="380" y="390" width="210" height="90" rx="18" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="485" y="445">VPN Connection</text><rect x="710" y="260" width="220" height="90" rx="18" fill="#dff6dd" stroke="#107c10" stroke-width="3"/><text x="820" y="315">Troubleshoot job</text><rect x="1040" y="260" width="230" height="90" rx="18" fill="#eadcf8" stroke="#8661c5" stroke-width="3"/><text x="1155" y="315">Storage diagnostics</text></g><g fill="none" stroke="#0078d4" stroke-width="6" marker-end="url(#a)"><path d="M270 305 C320 305 320 180 380 180"/><path d="M270 305 C320 305 320 435 380 435"/><path d="M590 180 C650 180 650 285 710 295"/><path d="M590 435 C650 435 650 325 710 315"/><path d="M930 305 H1040"/></g><rect x="60" y="520" width="1210" height="58" rx="12" fill="#eef7fd" stroke="#9ac7e8"/><text x="665" y="556" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#24445f">The job returns a health/action result and writes deeper diagnostics to Storage; continuous VPN logs remain a separate Azure Monitor design.</text></svg>