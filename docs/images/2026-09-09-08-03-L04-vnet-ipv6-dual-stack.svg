<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078d4"/></marker></defs><rect width="1400" height="620" fill="#f7fbff"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#16324f">Azure dual stack: IPv4 and IPv6 are separate forwarding/security paths</text><g font-family="Segoe UI,Arial" font-size="21" font-weight="600" text-anchor="middle"><rect x="60" y="250" width="230" height="90" rx="18" fill="#e8f1fb" stroke="#0078d4" stroke-width="3"/><text x="175" y="305">IPv4 + IPv6 Internet</text><rect x="380" y="250" width="220" height="90" rx="18" fill="#ddeaff" stroke="#005a9e" stroke-width="3"/><text x="490" y="305">Dual-stack VNet</text><rect x="690" y="250" width="260" height="90" rx="18" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="820" y="305">Subnet: IPv4 + IPv6 /64</text><rect x="1040" y="145" width="220" height="90" rx="18" fill="#dff6dd" stroke="#107c10" stroke-width="3"/><text x="1150" y="200">Dual-stack NIC</text><rect x="1040" y="365" width="220" height="90" rx="18" fill="#eadcf8" stroke="#8661c5" stroke-width="3"/><text x="1150" y="420">VM listener v4 + v6</text></g><g fill="none" stroke="#0078d4" stroke-width="6" marker-end="url(#a)"><path d="M290 295 H380"/><path d="M600 295 H690"/><path d="M950 295 C1000 295 1000 190 1040 190"/><path d="M1150 235 V365"/></g><rect x="60" y="520" width="1200" height="58" rx="12" fill="#eef7fd" stroke="#9ac7e8"/><text x="660" y="556" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#24445f">Every IPv6 subnet is /64; duplicate the required route, NSG, listener, and DNS behavior for IPv6 rather than assuming IPv4 policy applies.</text></svg>