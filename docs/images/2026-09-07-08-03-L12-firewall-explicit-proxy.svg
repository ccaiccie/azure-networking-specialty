<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#f8fbfd"/><text x="55" y="48" font-family="Segoe UI" font-size="26" font-weight="700" fill="#103a5c">Azure Firewall explicit proxy: clients address the firewall directly instead of depending on a UDR for HTTP/HTTPS</text><rect x="55" y="150" width="250" height="105" rx="12" fill="#ddebf7" stroke="#4472c4" stroke-width="2"/><text x="180" y="190" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#244062">Client / browser</text><text x="180" y="220" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#244062">Proxy or PAC configured</text><rect x="390" y="115" width="350" height="180" rx="12" fill="#0078d4"/><text x="565" y="157" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">Azure Firewall Policy</text><text x="565" y="188" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="white">Explicit proxy listener</text><text x="565" y="218" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">HTTP + HTTPS proxy traffic</text><text x="565" y="248" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="white">Application rules still authorize</text><rect x="805" y="75" width="310" height="125" rx="12" fill="#fff4ce" stroke="#d39e00" stroke-width="2"/><text x="960" y="116" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#5b4a00">Optional PAC file</text><text x="960" y="147" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#5b4a00">Azure Storage</text><text x="960" y="174" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#5b4a00">Managed identity reads blob</text><rect x="1135" y="235" width="230" height="105" rx="12" fill="#dff6dd" stroke="#107c10" stroke-width="2"/><text x="1250" y="277" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="700" fill="#0b5a23">Internet HTTP/S</text><text x="1250" y="307" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#0b5a23">Policy-controlled egress</text><path d="M305 200 H380" stroke="#4472c4" stroke-width="4"/><path d="M740 165 H795" stroke="#d39e00" stroke-width="4"/><path d="M740 235 C920 235 990 285 1125 285" fill="none" stroke="#107c10" stroke-width="4"/><rect x="350" y="355" width="700" height="44" rx="8" fill="#fff2f2" stroke="#a4262c"/><text x="700" y="383" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#8a1c1c">A listening proxy does not grant access by itself: the destination must still match an Azure Firewall application rule.</text></svg>