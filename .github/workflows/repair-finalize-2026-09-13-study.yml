name: Repair and finalize September 13 Azure study
on:
  push:
    paths:
      - '.github/workflows/repair-finalize-2026-09-13-study.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand under-depth lessons with topic-specific material
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html')
          s=p.read_text(encoding='utf-8')
          extras={
          2:"""<h3>Scale-change guardrails and performance evidence</h3><p>Capacity changes should be driven by a repeatable evidence set rather than a single utilization graph. Capture aggregate throughput in each direction, packets per second, concurrent connection behavior, route scale, and the traffic level during a realistic circuit or site failure. Compare those observations with the gateway metrics and the application latency experienced at the same timestamps. If the minimum scale is increased, repeat the identical load profile and preserve the before-and-after results. This gives operations a defensible reason for the new baseline and prevents future teams from reducing capacity simply because the gateway looks quiet during an off-peak hour. Autoscaling also deserves its own failure test: generate load that crosses the expected scaling boundary while routes remain unchanged, observe whether capacity grows without session disruption, and then verify scale-in after demand subsides. Where Private Link or another workload has documented fixed-scale considerations, maintain a separate design note so a later cost-optimization change does not silently move the gateway into an unsupported or poorly tested mode.</p>""",
          3:"""<h3>High-availability NVA insertion and route ownership</h3><p>Production NVA designs normally add a second appliance, which introduces another decision: what owns next-hop availability. A static UDR that points directly to one VM address creates a single-instance dependency even when two appliances exist. Vendor-supported patterns may use an internal load balancer, Gateway Load Balancer, clustering, or routing protocols to provide a resilient service IP or dynamic path. Whatever model is chosen, document which component detects failure and how quickly the source subnet stops sending new flows toward the failed instance. Then test session behavior separately from route convergence, because a route can move successfully while established stateful sessions still reset if the replacement appliance lacks synchronized state. On Azure, also verify that every participating NIC has IP forwarding enabled and that no more-specific UDR silently bypasses the service. During a failover test, capture effective routes before and after, appliance ingress/egress counters, and the exact application loss interval. That evidence distinguishes forwarding convergence from state synchronization and makes the recovery target measurable.</p>""",
          4:"""<h3>Governance, quotas, and migration planning</h3><p>A Public IP Prefix should be treated as shared address inventory rather than as an incidental resource created by one application team. Assign an owner, record the Azure regional public-IP quota consumed by the entire reserved block, and keep a child-allocation table that identifies every service using an address. When migrating an existing public service into the prefix, avoid changing the public identity and the application topology in the same step. Allocate the new child address, attach it according to the service’s supported migration process, update partner allowlists to the full prefix, validate inbound and outbound traffic, and only then retire the old address. For services that use several frontend or outbound IPs, confirm whether each must be in the same prefix and whether zone attributes match the target resource. Periodically reconcile Azure’s current child Public IP list with the IPAM record. An address that exists with no documented owner is a governance defect; a documented address that no longer exists may indicate an unintended release or incomplete decommissioning workflow.</p>""",
          5:"""<h3>Designing a probe that represents service readiness</h3><p>The most useful readiness endpoint is narrow enough to stay reliable but deep enough to detect conditions that make the backend unsafe for new work. For example, a web API might verify that the process is running, configuration is loaded, and a required local dependency is available, while intentionally avoiding a slow cross-region database query that would make every transient dependency delay remove otherwise useful capacity. Keep liveness and readiness concepts separate when the application platform supports both. During maintenance, intentionally return a non-success status from the readiness endpoint and confirm the load balancer removes the instance without stopping the process; this proves that operators can drain new work without creating a crash. Measure how many probe intervals are required before removal and restoration so the failover timeline is understood. If a backend flaps between Healthy and Unhealthy, correlate endpoint response time, host CPU, application logs, and probe metrics. Increasing thresholds can hide transient symptoms, but it should not replace fixing a readiness endpoint that blocks, times out, or depends on an unstable downstream service.</p>""",
          6:"""<h3>Deployment orchestration and timeout selection</h3><p>Connection draining works best when deployment automation explicitly coordinates backend registration state with application readiness. Add the replacement instance first, wait until Application Gateway reports it Healthy, and then remove the old instance so new traffic always has a valid destination. Use transaction telemetry to choose the drain timeout: examine high-percentile request duration, file-transfer size, WebSocket lifetime where relevant, and any regulatory requirement for uninterrupted uploads. A timeout that covers 99 percent of ordinary requests may still be wrong for a monthly batch operation that lasts much longer. If extremely long connections cannot be interrupted, redesign the application or rollout method rather than selecting an unbounded drain period. During a canary rollout, tag responses with a backend or release identifier so new requests can be proven to land on the replacement version while an older long-running connection finishes on the draining node. This produces user-visible evidence that the rollout behavior matches the intended control plane.</p>""",
          7:"""<h3>Building an incident sequence around the diagnostic</h3><p>Use VPN troubleshoot at a defined point in the incident workflow rather than as a button that is repeatedly pressed without changing evidence. First record the exact affected prefixes, connection name, failure start time, and whether other connections on the same gateway are healthy. Next capture the Azure connection status and byte counters, then start the scoped Network Watcher diagnostic. While it runs, collect IKE/IPsec state and logs from the remote peer using the same time window. After the result returns, branch the workflow: an Azure-side unhealthy finding drives remediation of the named gateway or connection condition; a Healthy result moves the investigation to routing, policy, NAT, or the application path. For BGP-based tunnels, also compare learned route counts and the specific destination prefix on both sides. Store the diagnostic artifacts with the incident ticket. This turns a transient platform test into durable evidence and makes recurring failures easier to compare across changes, software upgrades, and carrier events.</p>""",
          8:"""<h3>Safe rollout from Alert to Deny</h3><p>A threat-intelligence deployment should have an observation period and an enforcement decision point. Begin in Alert mode long enough to capture representative business cycles, then group events by source workload, destination indicator, application owner, and whether the flow was expected. High-volume alerts from one endpoint may indicate compromise, but they can also reveal an embedded third-party dependency the application team did not document. Investigate that dependency before creating an exception. When moving to Deny, choose a maintenance window and maintain a short list of critical transactions to retest immediately. Query threat-intelligence logs during the window so a newly blocked business flow can be attributed to the reputation control without disabling ordinary firewall policy. Exceptions should include the exact indicator, business owner, security approver, justification, and expiration date. Review them periodically because a permanent allowlist can outlive the false-positive condition and become a bypass. This operational lifecycle preserves the value of the feed while reducing pressure to turn the feature off globally after one disputed block.</p>""",
          9:"""<h3>Tuning with real client populations</h3><p>Rate-limit tuning should use production request distributions rather than an arbitrary round number. Build a histogram of requests per client socket IP for the protected path and identify corporate proxies, carrier NAT ranges, monitoring services, partner integrations, and legitimate automation that can create concentrated traffic. Select a threshold above normal high-percentile behavior while still low enough to protect the origin from abusive bursts. Then test both one-minute and five-minute windows against the application’s threat model. A login endpoint may benefit from a short burst limit, while an expensive reporting API may need control over sustained requests. Track blocked requests alongside origin CPU, latency, and request count; successful protection should reduce origin load when the limit engages. If legitimate NATed clients are blocked, refine the match scope, threshold, or application authentication strategy instead of assuming that rate limiting can provide precise per-user fairness. The control is most effective when combined with application-level quotas for identities the edge cannot distinguish by source IP alone.</p>""",
          10:"""<h3>Using verifier intents as change-control tests</h3><p>Network Verifier becomes much more valuable when intents are treated as executable architecture requirements. Define a small library that represents required positive flows, required isolation boundaries, and important service paths such as web-to-API 443, management-to-server 22, spoke-to-shared-DNS 53, and Internet-to-private-management denied. Store the resource IDs and traffic tuples with the design documentation and run the same intents before and after route-table, peering, NSG, or security-admin changes. A difference in outcome becomes a concrete review item instead of a vague statement that “routing changed.” Keep negative tests alongside positive ones, because a change that restores one application can accidentally open a path that was intentionally blocked. When the analysis identifies a blocking control, capture that object and rule in the change record. For unsupported runtime conditions or appliances outside the modeled scope, pair the static intent with Connection Troubleshoot or packet capture so the validation suite clearly separates what Network Verifier proves from what still requires live data-plane testing.</p>""",
          11:"""<h3>Maintenance runbook and override hygiene</h3><p>Administrative state should always have an owner and an expected restoration time. Before setting a backend Down, verify that monitoring can distinguish the override from an actual probe failure and that remaining backends have enough headroom for the new connections. After maintenance, do not jump directly from Down to Up simply to force traffic back. Restore the application, validate its readiness endpoint locally, set the admin state to None, and let the normal health probe prove eligibility. This preserves the meaning of health monitoring. If Up is used for a controlled diagnostic, record why the probe was considered misleading and remove the override immediately after the test. Periodically audit backend pools for states other than None; a forgotten Down backend silently removes capacity, while a forgotten Up backend can continue receiving connections despite a future real failure. Include TCP and UDP tests where both protocols are served because existing-flow behavior is not identical. The runbook should state whether application-level draining is also required before the load-balancer override.</p>""",
          12:"""<h3>Designing the error page as an independent outage dependency</h3><p>The custom page should remain useful when the protected application, its DNS dependencies, or its backend storage are unavailable. Host the artifact on an independent highly available public endpoint, keep the HTML self-contained where practical, and avoid JavaScript that calls the failing application for status. If images or style sheets are external, use absolute URLs on infrastructure that is expected to survive the same incident. Include a user-facing support message and a stable public support identifier, but never expose backend hostnames, private IP addresses, stack traces, or internal incident tooling. Test the page from outside the corporate network so authentication or proxy assumptions are discovered before an outage. Maintain a small synthetic test that retrieves every custom-error source and validates HTTP 200, content type, and size. When branding changes, refresh the gateway configuration in a controlled window and verify the cached response. This makes the custom-error system a deliberately managed resilience component rather than a forgotten static file that fails exactly when users need it.</p>"""
          }
          for n,extra in extras.items():
              pat=rf'(<section class="lesson" id="l{n}".*?)(<h3>Verification</h3>)'
              s,newcount=re.subn(pat,lambda m:m.group(1)+extra+m.group(2),s,count=1,flags=re.S)
              if newcount!=1: raise SystemExit(f'could not insert depth expansion into lesson {n}')
          p.write_text(s,encoding='utf-8')

      - name: Hard validate repaired report
        shell: python
        run: |
          from pathlib import Path
          import re,json,html,difflib,sys
          report=Path('docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html'); s=report.read_text(encoding='utf-8')
          ledger=json.loads(Path('docs/azure-study-uniqueness-ledger.json').read_text(encoding='utf-8')); errors=[]
          lessons=re.findall(r'<section class="lesson"[^>]*>(.*?)</section>',s,flags=re.S)
          def wc(b):
              b=re.sub(r'<pre\b.*?</pre>|<h[1-6]\b.*?</h[1-6]>|<div class="sources".*?</div>|<figure\b.*?</figure>',' ',b,flags=re.S|re.I)
              b=re.sub(r'<[^>]+>',' ',b); b=html.unescape(b)
              return len(re.findall(r"\b[\w][\w'’/-]*\b",b))
          counts={str(i):wc(l) for i,l in enumerate(lessons,1)}
          if len(lessons)!=12: errors.append(f'lesson_count={len(lessons)}')
          for i,l in enumerate(lessons,1):
              if counts[str(i)]<700: errors.append(f'lesson {i} words={counts[str(i)]}')
              for h in ['Why it matters','Architecture','Prerequisites and implementation','Verification','Troubleshooting']:
                  if h not in l: errors.append(f'lesson {i} missing {h}')
              if 'class="lab"' not in l or 'class="output"' not in l or 'class="architecture-diagram"' not in l: errors.append(f'lesson {i} missing implementation/output/diagram')
              paras=[html.unescape(re.sub(r'<[^>]+>',' ',p)) for p in re.findall(r'<p\b[^>]*>(.*?)</p>',l,flags=re.S|re.I)]
              norm=[re.sub(r'\s+',' ',x).strip().lower() for x in paras if len(re.sub(r'<[^>]+>',' ',x).split())>=40]
              for a in range(len(norm)):
                  for b in range(a+1,len(norm)):
                      if difflib.SequenceMatcher(None,norm[a],norm[b]).ratio()>=.93: errors.append(f'lesson {i} near duplicate paragraphs')
          if re.search(r'Exam and interview takeaways|<h3>Summary</h3>',s,re.I): errors.append('forbidden summary/takeaways')
          if 'font:14.5px/1.56' not in s or 'h1{font-size:30px' not in s or 'h2{font-size:23px' not in s or 'h3{font-size:18px' not in s: errors.append('typography')
          if '.architecture-diagram{display:block;width:100%' not in s or '.architecture-diagram img{display:block;width:100%' not in s: errors.append('full width diagrams')
          if '@media' in s: errors.append('mobile CSS')
          bases=re.findall(r'<img src="images/([^"]+)\.svg"',s)
          if len(bases)!=12: errors.append(f'diagram refs={len(bases)}')
          for base in bases:
              d=Path('docs/images')/(base+'.drawio'); v=Path('docs/images')/(base+'.svg')
              if not d.exists() or 'mxgraph.azure2.' not in d.read_text(encoding='utf-8'): errors.append('invalid drawio '+str(d))
              if not v.exists() or not v.read_text(encoding='utf-8').lstrip().startswith('<svg'): errors.append('invalid svg '+str(v))
          qm=re.findall(r'^\[(H|C|R|S),\d+,',s,flags=re.M); dist={k:qm.count(k) for k in 'HCRS'}
          if len(qm)!=50 or dist!={'H':15,'C':13,'R':10,'S':12}: errors.append(f'quiz count/dist {len(qm)} {dist}')
          if not all(x in s for x in ['function checkOne','function gradeAll','function resetQuiz']): errors.append('quiz controls')
          if s.count("'https://learn.microsoft.com/")<50: errors.append('quiz sources')
          primary=['https://learn.microsoft.com/en-us/azure/expressroute/expressroute-erdirect-about','https://learn.microsoft.com/en-us/azure/expressroute/scalable-gateway','https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface','https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix','https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview','https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings','https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview','https://learn.microsoft.com/en-us/azure/firewall-manager/threat-intelligence-settings','https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit','https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-virtual-network-verifier','https://learn.microsoft.com/en-us/azure/load-balancer/admin-state-overview','https://learn.microsoft.com/en-us/azure/application-gateway/custom-error']
          scenario=['https://learn.microsoft.com/en-us/cli/azure/network/express-route/port?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-add-gateway-resource-manager','https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-create-route-table','https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-public-ip-prefix-cli','https://learn.microsoft.com/en-us/cli/azure/network/lb/probe?view=azure-cli-latest','https://learn.microsoft.com/en-us/cli/azure/network/application-gateway/http-settings?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-cli','https://learn.microsoft.com/en-us/cli/azure/network/firewall?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit-configure','https://learn.microsoft.com/en-us/azure/virtual-network-manager/how-to-verify-reachability-with-virtual-network-verifier','https://learn.microsoft.com/en-us/azure/load-balancer/manage-admin-state-how-to','https://learn.microsoft.com/en-us/powershell/module/az.network/add-azapplicationgatewaycustomerror']
          fps=['expressroute-direct-qinq-dot1q','expressroute-ergwscale-autoscaling','nva-ip-forwarding-udr-insertion','public-ip-prefix-lifecycle','load-balancer-health-probes','application-gateway-connection-draining','network-watcher-vpn-troubleshoot','azure-firewall-threat-intelligence','front-door-waf-rate-limiting','avnm-network-verifier-reachability','load-balancer-admin-state','application-gateway-custom-error-pages']
          pu=set(); pf=set()
          for e in ledger.get('entries',[]):
              pu.update(e.get('canonical_urls',[])); pu.update(e.get('primary_article_urls',[])); pu.update(e.get('scenario_article_urls',[])); pf.update(e.get('title_fingerprints',[])); pf.update(e.get('topic_fingerprints',[])); pf.update(e.get('source_case_fingerprints',[]))
          errors += ['URL collision '+u for u in primary+scenario if u in pu]
          errors += ['fingerprint collision '+f for f in fps if f in pf]
          if len(set(primary+scenario))!=24: errors.append('current-run source duplication')
          print('LESSON_WORD_COUNTS='+json.dumps(counts,sort_keys=True)); print('QUESTION_DISTRIBUTION='+json.dumps(dist,sort_keys=True))
          if errors:
              print('VALIDATION_ERRORS:'); [print('-',e) for e in errors]; sys.exit(1)
          Path('/tmp/counts.json').write_text(json.dumps(counts),encoding='utf-8')
          print('HARD_GATE_VALIDATION=PASS')

      - name: Commit repaired report and fetch it back
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html
          git commit -m "Meet September 13 Azure study lesson depth gate"
          git pull --rebase origin main
          git push
          git fetch origin main
          git show origin/main:docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html >/tmp/fetched-report.html
          grep -q 'Exactly 50 automatically gradable questions' /tmp/fetched-report.html
          for f in $(grep -o 'images/[^" ]*\.svg' /tmp/fetched-report.html | sort -u); do git show origin/main:docs/$f >/tmp/asset.svg; grep -q '^<svg' /tmp/asset.svg; done
          echo REPORT_AND_ASSET_FETCHBACK=PASS

      - name: Promote exact report in index
        shell: python
        run: |
          from pathlib import Path
          url='https://ccaiccie.github.io/azure-networking-specialty/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html'
          Path('docs/index.html').write_text(f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Azure Networking Specialty — Daily Study Reports</title><style>body{{margin:0;background:#eef3f8;color:#172b3d;font:14.5px/1.56 "Segoe UI",Arial,sans-serif}}main{{width:900px;max-width:calc(100% - 48px);margin:46px auto}}article{{background:#fff;border:1px solid #ccd8e2;padding:28px 34px;border-top:6px solid #0078d4}}h1{{font-size:30px;color:#0b3558;margin-top:0}}h2{{font-size:23px;color:#0b3558}}a{{color:#005ea8;font-weight:700}}.box{{background:#eef7fd;border-left:5px solid #0078d4;padding:16px 18px;margin:20px 0}}.meta{{font-size:12.5px;color:#5b6d7d}}</style></head><body><main><article><h1>Azure Networking Specialty daily study reports</h1><p>Current alignment: AZ-700 / Microsoft Certified: Azure Network Engineer Associate.</p><div class="box"><h2>Latest validated report — September 13, 2026</h2><p><a href="{url}">Open today's interactive Azure networking study report</a></p><p class="meta"><code>{url}</code></p></div><p class="meta">Validated: 12 deep lessons, full-width Azure draw.io/SVG diagrams, implementation and expected-output troubleshooting, and exactly 50 graded questions.</p></article></main></body></html>''',encoding='utf-8')
      - name: Commit and fetch-back index
        run: |
          git add docs/index.html
          git commit -m "Promote validated September 13 Azure study report"
          git push
          git fetch origin main
          git show origin/main:docs/index.html >/tmp/fetched-index.html
          test "$(grep -c 'Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html' /tmp/fetched-index.html)" -ge 1
          echo INDEX_FETCHBACK=PASS

      - name: Advance uniqueness ledger
        shell: python
        run: |
          from pathlib import Path
          import json,re,html
          s=Path('docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html').read_text(encoding='utf-8')
          lp=Path('docs/azure-study-uniqueness-ledger.json'); ledger=json.loads(lp.read_text(encoding='utf-8'))
          lessons=re.findall(r'<section class="lesson"[^>]*>(.*?)</section>',s,flags=re.S)
          def wc(b):
              b=re.sub(r'<pre\b.*?</pre>|<h[1-6]\b.*?</h[1-6]>|<div class="sources".*?</div>|<figure\b.*?</figure>',' ',b,flags=re.S|re.I); b=re.sub(r'<[^>]+>',' ',b); b=html.unescape(b); return len(re.findall(r"\b[\w][\w'’/-]*\b",b))
          counts={str(i):wc(x) for i,x in enumerate(lessons,1)}
          primary=['https://learn.microsoft.com/en-us/azure/expressroute/expressroute-erdirect-about','https://learn.microsoft.com/en-us/azure/expressroute/scalable-gateway','https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface','https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix','https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview','https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings','https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview','https://learn.microsoft.com/en-us/azure/firewall-manager/threat-intelligence-settings','https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit','https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-virtual-network-verifier','https://learn.microsoft.com/en-us/azure/load-balancer/admin-state-overview','https://learn.microsoft.com/en-us/azure/application-gateway/custom-error']
          scenario=['https://learn.microsoft.com/en-us/cli/azure/network/express-route/port?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-add-gateway-resource-manager','https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-create-route-table','https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-public-ip-prefix-cli','https://learn.microsoft.com/en-us/cli/azure/network/lb/probe?view=azure-cli-latest','https://learn.microsoft.com/en-us/cli/azure/network/application-gateway/http-settings?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-cli','https://learn.microsoft.com/en-us/cli/azure/network/firewall?view=azure-cli-latest','https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit-configure','https://learn.microsoft.com/en-us/azure/virtual-network-manager/how-to-verify-reachability-with-virtual-network-verifier','https://learn.microsoft.com/en-us/azure/load-balancer/manage-admin-state-how-to','https://learn.microsoft.com/en-us/powershell/module/az.network/add-azapplicationgatewaycustomerror']
          fps=['expressroute-direct-qinq-dot1q','expressroute-ergwscale-autoscaling','nva-ip-forwarding-udr-insertion','public-ip-prefix-lifecycle','load-balancer-health-probes','application-gateway-connection-draining','network-watcher-vpn-troubleshoot','azure-firewall-threat-intelligence','front-door-waf-rate-limiting','avnm-network-verifier-reachability','load-balancer-admin-state','application-gateway-custom-error-pages']
          features=['ExpressRoute Direct QinQ versus Dot1Q','ExpressRoute scalable gateway ErGwScale','NVA forwarding with NIC IP forwarding and UDRs','Azure Public IP Prefix lifecycle','Standard Load Balancer health probes','Application Gateway connection draining','Network Watcher VPN troubleshoot','Azure Firewall threat intelligence','Front Door WAF rate limiting','AVNM Network Verifier reachability','Load Balancer administrative state','Application Gateway custom error pages']
          rid='azure-networking-study-2026-09-13-08-30-pacific'; ledger['entries']=[e for e in ledger.get('entries',[]) if e.get('run_id')!=rid]
          ledger['entries'].append({'run_id':rid,'created_at_utc':'2026-09-13T15:30:00Z','local_date':'2026-09-13','local_timezone':'America/Los_Angeles','report_filename':'Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html','report_url':'https://ccaiccie.github.io/azure-networking-specialty/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-13-08-30.html','primary_article_urls':primary,'scenario_article_urls':scenario,'canonical_urls':primary+scenario,'title_fingerprints':fps,'topic_fingerprints':fps,'feature_lessons':features,'source_case_fingerprints':[f+'-implementation-case' for f in fps],'validation':{'report_fetchback_pre_ledger':'passed','lesson_count':12,'lesson_word_counts':counts,'question_count':50,'domain_distribution':{'Hybrid connectivity and architecture':15,'Core networking infrastructure':13,'Routing and traffic management':10,'Security, monitoring, and private service access':12},'source_role_separation':'passed','nonredundancy':'passed','implementation_cli_terraform':'passed','verification_expected_output':'passed','troubleshooting_failure_output':'passed','drawio_svg_pairs':12,'full_width_diagrams':'passed','compact_desktop_typography':'passed','thirty_day_uniqueness':'passed'}})
          lp.write_text(json.dumps(ledger,indent=2)+"\n",encoding='utf-8'); print('LEDGER_COUNTS='+json.dumps(counts,sort_keys=True))
      - name: Commit and fetch-back ledger
        run: |
          git add docs/azure-study-uniqueness-ledger.json
          git commit -m "Advance Azure study uniqueness ledger for September 13"
          git push
