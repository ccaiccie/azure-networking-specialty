name: Recover Azure 0910 staged build
on:
  push:
    paths:
      - '.github/workflows/recover-azure-0910.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover staged stream and extract complete TAR members
        shell: bash
        run: |
          set -u
          cat docs/.azure0910-build-part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/azure0910.gz
          gzip -dc /tmp/azure0910.gz > /tmp/azure0910.tar || true
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/azure0910.tar').read_bytes()
          print('decompressed bytes',len(b))
          pos=0; extracted=[]
          while pos+512 <= len(b):
              h=b[pos:pos+512]
              if h==b'\0'*512: break
              name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
              try: size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except Exception: break
              start=pos+512; end=start+size
              print('member',name,'size',size,'available',max(0,len(b)-start))
              if end>len(b):
                  print('INCOMPLETE',name); break
              if name.startswith('docs/'):
                  p=Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(b[start:end]); extracted.append(name)
              pos=start+((size+511)//512)*512
          Path('docs/.azure0910-recovery-status.txt').write_text('\n'.join(extracted) or 'NO COMPLETE DOC MEMBERS\n')
          PY
      - name: Commit recovered complete members and status
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.azure0910-recovery-status.txt docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-10-08-03.html 2>/dev/null || git add docs/.azure0910-recovery-status.txt
          git commit -m 'Recover complete Azure September 10 staged report member' || exit 0
          git push