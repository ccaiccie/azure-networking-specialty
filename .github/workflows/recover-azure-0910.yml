name: Recover Azure 0910 staged build
on:
  push:
    paths:
      - '.github/workflows/recover-azure-0910.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover partial staged report member
        shell: bash
        run: |
          set -u
          cat docs/.azure0910-build-part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/azure0910.gz
          gzip -dc /tmp/azure0910.gz > /tmp/azure0910.tar || true
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/azure0910.tar').read_bytes(); pos=0
          while pos+512<=len(b):
              h=b[pos:pos+512]
              if h==b'\0'*512: break
              name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
              try:size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except:break
              start=pos+512; end=start+size
              if name.endswith('Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-10-08-03.html'):
                  data=b[start:min(end,len(b))]
                  Path('docs/.azure0910-partial-report.html').write_bytes(data)
                  Path('docs/.azure0910-recovery-status.txt').write_text(f'{len(data)}/{size} bytes recovered\n')
                  break
              if end>len(b): break
              pos=start+((size+511)//512)*512
          PY
      - name: Commit partial recovery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.azure0910-partial-report.html docs/.azure0910-recovery-status.txt
          git commit -m 'Expose partial September 10 report recovery' || exit 0
          git push