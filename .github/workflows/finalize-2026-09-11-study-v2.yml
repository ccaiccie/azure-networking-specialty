          Path('docs/images/2026-09-11-08-00-L06-dns-alias.drawio').write_text('''<mxfile><diagram name="Azure DNS CAA"><mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/><mxCell id="2" value="Azure Public DNS&#xa;CAA policy" style="shape=mxgraph.azure.dns_zone;fillColor=#0078D4;fontColor=#fff" vertex="1" parent="1"><mxGeometry x="50" y="70" width="220" height="90" as="geometry"/></mxCell><mxCell id="3" value="Certificate Authority&#xa;issue / issuewild check" style="shape=mxgraph.azure.key_vault;fillColor=#50E6FF" vertex="1" parent="1"><mxGeometry x="390" y="50" width="300" height="130" as="geometry"/></mxCell><mxCell id="4" value="Public TLS certificate" style="shape=mxgraph.azure.app_service_certificates;fillColor=#59B4D9" vertex="1" parent="1"><mxGeometry x="820" y="70" width="230" height="90" as="geometry"/></mxCell></root></mxGraphModel></diagram></mxfile>''')
          p.write_text(s)
          # Hard validation.
          lessons=re.findall(r'<section class="lesson" id="l(\d+)">(.*?)</section>',s,re.S); errs=[]; counts={}
          if len(lessons)!=12: errs.append(f'lesson_count={len(lessons)}')
          for n,b in lessons:
              for req in ['Why it matters','Architecture','Prerequisites and implementation','Verification','Troubleshooting']:
                  if req not in b: errs.append(f'L{n} missing {req}')
              x=re.sub(r'<pre.*?</pre>|<div class="sources".*?</div>|<figure.*?</figure>|<h[1-6].*?</h[1-6]>',' ',b,flags=re.S); x=re.sub(r'<[^>]+>',' ',x); x=html.unescape(x)
              counts[n]=len(re.findall(r"\b[\w’'-]+\b",x))
              if counts[n]<700: errs.append(f'L{n} substantive_words={counts[n]}')
              if '<pre><code>' not in b or 'class="output"' not in b: errs.append(f'L{n} command/output gate')
              if 'Exam and interview takeaways' in b or '<h3>Summary' in b: errs.append(f'L{n} forbidden generic section')
          qtxt=re.search(r'const Q=\[(.*?)\];function sh',s,re.S).group(1); dist={k:len(re.findall(r'\['+k+r',\d+,',qtxt)) for k in 'HCRS'}
          if dist!={'H':15,'C':13,'R':10,'S':12}: errs.append(f'quiz={dist} total={sum(dist.values())}')
          for i in range(1,13):
              stem=f'2026-09-11-08-00-L{i:02d}'; ds=list(Path('docs/images').glob(stem+'*.drawio')); vs=list(Path('docs/images').glob(stem+'*.svg'))
              if len(ds)!=1 or len(vs)!=1: errs.append(f'L{i} diagram pair')
              elif 'mxgraph.azure.' not in ds[0].read_text() or '<svg' not in vs[0].read_text(): errs.append(f'L{i} diagram content')
          data=json.loads(Path('docs/azure-study-uniqueness-ledger.json').read_text()); blocked=set(u for e in data['entries'] for u in e.get('canonical_urls',[])); urls=re.findall(r'href="(https://learn\.microsoft\.com/[^"]+)"',s); collisions=sorted(set(urls)&blocked)
