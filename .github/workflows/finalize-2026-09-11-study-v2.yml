          p=Path('docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-11-08-00.html'); s=p.read_text()
          # Current documented ExpressRoute IPv6 CLI syntax.
          s=s.replace('--primary-peer-address-prefix-v6 &lt;2001:db8:100::/126&gt; \\\n  --secondary-peer-address-prefix-v6 &lt;2001:db8:100:4::/126&gt;', '--ip-version ipv6 \\\n  --primary-peer-subnet &lt;2001:db8:100::/126&gt; \\\n  --secondary-peer-subnet &lt;2001:db8:100:4::/126&gt;')
          # Replace blocked source URLs with distinct authoritative sources.
          repl={
          'https://learn.microsoft.com/en-us/azure/expressroute/howto-routing-cli\">Scenario/CLI: Configure ExpressRoute peering with Azure CLI':'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings\">Scenario: ExpressRoute circuit and peering limits',
          'https://learn.microsoft.com/en-us/azure/expressroute/how-to-routefilter-portal\">Primary: configure route filters':'https://learn.microsoft.com/en-us/cli/azure/network/route-filter?view=azure-cli-latest\">Primary: Azure CLI route-filter command reference',
          'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing\">Scenario: ExpressRoute routing requirements':'https://learn.microsoft.com/en-us/azure/expressroute/bgp-communities\">Scenario: ExpressRoute BGP communities',
          'https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource\">Primary: NAT Gateway resource behavior':'https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview\">Primary: NAT Gateway architecture and timers',
          'https://learn.microsoft.com/en-us/azure/application-gateway/overview-v2\">Scenario: Application Gateway v2 architecture':'https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components\">Scenario: Application Gateway components',
          'https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-vm-network-routing-problem-cli\">Primary: diagnose routing with Next Hop CLI':'https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview\">Primary: Network Watcher Next Hop overview'}
          for a,b in repl.items(): s=s.replace(a,b)
          # Replace the already-blocked DNS alias lesson with a distinct deep CAA lesson.
          l6='''<section class="lesson" id="l6"><div class="eyebrow">Lesson 6 · Core/Security</div><h2>Azure DNS CAA records: constrain certificate issuance at the DNS control plane</h2><h3>Why it matters</h3><p>Public TLS depends on certificate authorities deciding whether they are permitted to issue a certificate for a domain. DNS Certification Authority Authorization records add a domain-owner policy signal to that process. A CAA record can state which CA is allowed to issue normal certificates, which CA may issue wildcard certificates, and where a CA can report policy violations. This does not replace certificate validation, ACME challenges, or private-key protection. It reduces the set of public CAs that should consider themselves authorized to issue for your namespace, which is valuable when many teams and automated platforms can request certificates.</p><p>CAA is especially useful in a cloud environment because DNS and certificate automation are often owned by different teams. The DNS team can publish a stable authorization policy while application teams rotate certificates independently. A misconfigured CAA policy can also cause a real production incident: a renewal workflow that worked for months can suddenly fail when the selected CA is no longer authorized. That makes CAA both a security control and a dependency that belongs in certificate-renewal troubleshooting.</p><h3>Architecture</h3><p>CAA is an ordinary public DNS record type served by the authoritative zone. Each record has a flags byte, a tag, and a value. The <code>issue</code> tag authorizes a CA for normal issuance. <code>issuewild</code> controls wildcard issuance separately. <code>iodef</code> provides a reporting contact or URL. A CA evaluating <code>app.example.com</code> follows the DNS hierarchy according to the CAA standard and uses the applicable authorization records before issuance. The client browser does not consult CAA during the TLS handshake; CAA affects the CA’s issuance decision, not runtime certificate validation.</p><figure class="diagram"><img src="images/2026-09-11-08-00-L06-dns-alias.svg" alt="Azure DNS CAA certificate authorization architecture"><figcaption>Azure DNS publishes CAA policy; a certificate authority checks that policy before issuing a public certificate, while clients continue to validate the resulting certificate normally.</figcaption><div class="meta"><a href="images/2026-09-11-08-00-L06-dns-alias.drawio">Editable draw.io</a> · <a href="images/2026-09-11-08-00-L06-dns-alias.svg">SVG</a></div></figure><h3>Prerequisites and implementation</h3><p>Host the public zone in Azure DNS and verify delegation before treating CAA as authoritative. Inventory every CA and automated certificate service that legitimately issues for the domain, including wildcard workflows. If two CAs are valid, publish two <code>issue</code> records rather than authorizing one and discovering the second only during an emergency renewal. Decide whether wildcard issuance should be narrower than ordinary issuance; <code>issuewild</code> exists specifically so those policies can differ.</p><div class="lab"><pre><code>az network dns record-set caa create -g &lt;dns-rg&gt; -z &lt;zone&gt; \
  -n @ --ttl 300

az network dns record-set caa add-record -g &lt;dns-rg&gt; -z &lt;zone&gt; \
  -n @ --flags 0 --tag issue --value "ca.example"

az network dns record-set caa add-record -g &lt;dns-rg&gt; -z &lt;zone&gt; \
  -n @ --flags 0 --tag issuewild --value ";"

az network dns record-set caa show -g &lt;dns-rg&gt; -z &lt;zone&gt; -n @ -o jsonc</code></pre><p>The empty value represented by a semicolon for <code>issuewild</code> is a common pattern for disallowing wildcard issuance while still authorizing a named CA for ordinary certificates. Use the exact value required by your CA and policy; do not copy the example CA string into production. If you need an incident-reporting destination, add an <code>iodef</code> record with a supported mailto or URL value according to the CAA specification and CA behavior.</p></div><h3>Policy inheritance and change safety</h3><p>Think through delegation boundaries. A separately delegated child zone can publish its own records and may represent a different administrative authority. Before tightening the parent policy, query representative names in each child namespace and confirm which CAA response the issuing CA will evaluate. Keep TTL low during a planned CA migration, add the new CA before switching renewal jobs, wait for caches to age, perform a test issuance, and only then remove the old authorization. That sequence prevents a security hardening change from becoming a certificate-expiry incident.</p><p>CAA also does not prove that an unauthorized CA can never make a mistake; it is a policy signal that compliant public CAs are expected to honor. Continue using certificate transparency monitoring, short certificate lifetimes, protected DNS administration, and controlled ACME credentials. The strongest design uses CAA to reduce authorized issuers while independent monitoring detects unexpected issuance.</p><h3>Verification</h3><pre><code>az network dns record-set caa show -g &lt;dns-rg&gt; -z &lt;zone&gt; -n @ -o jsonc
nslookup -type=CAA &lt;zone&gt;
# or: dig CAA &lt;zone&gt;</code></pre><div class="ok"><strong>Representative successful state</strong><pre class="output"><code>CAA 0 issue "ca.example"
CAA 0 issuewild ";"
TTL 300
Authoritative query: NOERROR
Certificate test issuance with ca.example: authorized</code></pre><p>Success means the authoritative DNS response contains the intended records and a controlled issuance test succeeds with an authorized CA. Do not infer policy from the Azure resource alone; verify the public DNS answer because a broken registrar delegation can make a perfectly configured Azure zone irrelevant to Internet resolvers.</p></div><h3>Troubleshooting</h3><div class="bad"><pre class="output"><code>Certificate renewal: CAA authorization failure
az network dns record-set caa show: issue="ca-old.example"
Current ACME account CA: ca-new.example
Public dig CAA example.com: 0 issue "ca-old.example"</code></pre><p>The network path and ACME challenge can be healthy while issuance fails because the CA is not authorized. Add the intended new CA, wait for TTL propagation, retest issuance, and remove the old CA only after the new workflow is proven. If Azure shows the new value but public resolvers still show the old value, compare the authoritative Azure name servers with the parent delegation and query the authoritative servers directly. If a child domain behaves differently from the parent, inspect the child delegation and its own CAA policy before changing the parent record.</p><pre><code>az network dns record-set caa add-record -g &lt;dns-rg&gt; -z &lt;zone&gt; \
  -n @ --flags 0 --tag issue --value "ca-new.example"
az network dns record-set caa list -g &lt;dns-rg&gt; -z &lt;zone&gt; -o table</code></pre></div><h3>Operational guardrails that make CAA useful</h3><p>Treat CAA changes like firewall-policy changes because they alter what an external security service is allowed to do. Store the intended issuer inventory in infrastructure-as-code, require review from both DNS and PKI owners, and run a pre-expiry synthetic renewal against a nonproduction hostname. Alert on unexpected changes to the CAA record set through Azure activity logs. When an application team adopts a managed certificate service, add its CA authorization before the first production request rather than granting broad issuers permanently. Conversely, when a CA is retired, remove its authorization after every certificate using it has been replaced. This lifecycle discipline keeps the DNS policy aligned with actual certificate operations instead of becoming a stale record that either blocks legitimate renewal or authorizes an issuer nobody still uses.</p><div class="sources"><a href="https://learn.microsoft.com/en-us/azure/dns/dns-zones-records">Primary: Azure DNS record types and CAA fields</a> · <a href="https://learn.microsoft.com/en-us/cli/azure/network/dns/record-set/caa?view=azure-cli-latest">Scenario/CLI: manage Azure DNS CAA records</a></div></section>'''
          s=re.sub(r'<section class="lesson" id="l6">.*?</section>',l6,s,flags=re.S)
          s=s.replace('Azure DNS alias records to Azure resources','Azure DNS CAA certificate-authority authorization')
          # Replace alias quiz items with CAA-specific questions.
          replacements={
          "What does a DNS alias A record to a public IP store logically?":"What does the CAA issue tag control?",
          "['A resource reference','Only a copied literal IP','A BGP community','An NSG tag'],'A resource reference','Alias records can reference the Azure public IP resource.'":"['Which CA may issue ordinary certificates','Which resolver caches A records','Which NSG allows HTTPS','Which BGP ASN is trusted'],'Which CA may issue ordinary certificates','The issue tag authorizes certificate authorities for ordinary issuance.'",
          "Why can alias records reduce dangling DNS risk?":"What does issuewild control independently?",
          "['They track supported resource lifecycle','They disable caching','They encrypt DNS','They require private endpoints'],'They track supported resource lifecycle','Deleting/changing the target does not leave a stale literal address in the same way.'":"['Wildcard certificate issuance','DNSSEC signing keys','TLS client validation','ExpressRoute prefixes'],'Wildcard certificate issuance','issuewild lets wildcard authorization differ from ordinary issuance.'",
          "Can an alias help at the zone apex?":"Does a browser consult CAA during the TLS handshake?",
          "['Yes for supported targets','No, apex can never target Azure','Only with MX records','Only in Private DNS'],'Yes for supported targets','Alias avoids the CNAME-at-apex restriction for supported scenarios.'":"['No','Yes on every handshake','Only for HTTP/2','Only when DNSSEC is disabled'],'No','CAA is evaluated by certificate authorities during issuance, not by browsers during normal TLS validation.'",
          "Alias target deleted and record returns no A answer. Interpretation?":"Renewal fails with CAA authorization error while DNS resolves. First check?",
          "['Protective lifecycle behavior','DNSSEC compromise','NSG deny','BGP failure'],'Protective lifecycle behavior','The alias avoids serving a stale literal target.'":"['Whether the active CA is authorized by issue/issuewild','NSG priority','NAT idle timeout','ExpressRoute BFD'],'Whether the active CA is authorized by issue/issuewild','CAA can block issuance even when DNS and ACME reachability are otherwise healthy.'"}
          for a,b in replacements.items(): s=s.replace(a,b)
          # Remove one Core question to restore exactly 50 (keep the more implementation-specific Floating IP item).
          s=re.sub(r",\[C,10,'What guest-side configuration may Floating IP require\?'.*?'The guest must accept the floating destination address\.'\]","",s)
          # Add unique implementation depth to lessons that were under 700 substantive words.
          extras={
          1:"""<h3>Migration controls for a real enterprise rollout</h3><p>Run IPv6 as a staged address-family migration rather than a flag day. Start with one noncritical subnet, one test VM, and one pair of on-premises prefixes. Capture the IPv4 route table before the change and compare it afterward to prove the new address family did not disturb existing production reachability. On the CE, apply separate IPv6 prefix lists and maximum-prefix thresholds so an accidental broad advertisement cannot consume the routing table. If the enterprise uses route reflectors, verify they carry IPv6 unicast and preserve the expected next hop. Measure MTU behavior with IPv6 because routers cannot fragment transit IPv6 packets; Path MTU Discovery and ICMPv6 Packet Too Big messages must work. A design that blocks essential ICMPv6 can pass small pings and still fail larger application transfers. Finally, document rollback as removal of IPv6 advertisements and peering configuration while leaving IPv4 untouched. That separation is one of the strongest operational benefits of adding IPv6 alongside a proven IPv4 ExpressRoute path.</p>""",
          2:"""<h3>Resiliency checks beyond the SKU label</h3><p>An AZ suffix is not proof that every dependency is zone resilient. Verify that the Azure region actually supports availability zones and that the migrated gateway is deployed in the supported zone-redundant mode. Then inspect the on-premises side: a single physical firewall, one ISP handoff, or one BGP process can remain the dominant failure domain even when Azure has improved. For active-active gateways, verify both Azure tunnel endpoints are configured on the customer device and that BGP learns usable paths over both. Perform a controlled single-tunnel failure and record convergence time, packet loss, and route withdrawal behavior. Also test P2S authentication and address-pool assignment if the same gateway serves remote users; S2S success does not validate the P2S plane. Keep a post-migration evidence bundle containing target SKU, public IP IDs, tunnel states, BGP routes, and synthetic application results. That evidence lets the team distinguish a later carrier or peer-device fault from the platform migration itself.</p>""",
          3:"""<h3>Segmentation design pattern</h3><p>A practical way to use custom hub route tables is to model trust zones rather than individual spokes. Production connections can associate with a Production table, shared services with Shared, and restricted workloads with Isolated. Propagation then becomes an explicit statement of which zones may learn each prefix set. If Internet or private traffic must traverse Azure Firewall, use routing intent when it matches the requirement instead of recreating the same default-route policy manually in many tables. For custom NVA service insertion, document every forward and return association because a managed hub does not infer symmetry from your intent. When multiple hubs exist, labels can simplify propagation across hubs, but they can also broaden reachability unexpectedly if reused casually. Validate effective routes from at least one representative connection in every zone after each change. A route-table design is complete only when you can explain both the path a packet takes and the tables that caused the reverse path to exist.</p>""",
          4:"""<h3>Prefix-count and change-control discipline</h3><p>Before attaching a new service community, record the current number of received Microsoft-peering prefixes on both CE routers. After the filter change, compare the delta with the expected service footprint. A large unexpected increase is a reason to stop and inspect the selected community before redistributing those routes deeper into the enterprise. Microsoft peering has a finite prefix limit, so CE maximum-prefix thresholds should protect the router without being set so close to normal operation that a legitimate Microsoft expansion resets the session. Keep Microsoft-peering routes in a dedicated routing policy domain where possible; do not redistribute them blindly into every campus or data-center table. If a SaaS proxy or secure web gateway is supposed to remain the egress path for some Microsoft services, receiving a more specific ExpressRoute route can bypass that security path unless local preference and redistribution are designed deliberately. Route filters determine what Microsoft advertises, but enterprise policy still determines where those routes win.</p>""",
          5:"""<h3>Capacity math for concentrated destinations</h3><p>Model the worst destination tuple, not just aggregate Internet traffic. NAT Gateway can reuse the same source port simultaneously for different destination endpoints, so a workload talking to thousands of destinations has a different exhaustion profile from a proxy farm opening enormous numbers of connections to one API endpoint. Capture connection concurrency, close method, and retry behavior from application telemetry. FIN-closed and RST-closed flows have different reuse hold-down timers, and half-open connections consume state while waiting for handshake completion. If a partner endpoint rate-limits or silently drops SYNs, client retries can amplify SNAT pressure even though bandwidth is low. During a load test, correlate FailedSNATConnectionCount with application connect errors and the remote destination. This makes the remediation defensible: add public IP inventory when translation capacity is truly the limit, but fix connection pooling, retry storms, or remote endpoint behavior when those are the real drivers.</p>""",
          7:"""<h3>Policy compression without semantic loss</h3><p>Before consolidating many rules into one augmented rule, prove that the original rules truly share the same action, direction, protocol, destination scope, and business owner. Combining unrelated exceptions simply because the CLI accepts multiple prefixes creates a rule that is harder to review and may grant unintended cross-product access—for example, every listed source gains access to every listed destination port. When that cross-product is not intended, keep separate rules or use application security groups that express workload roles. Track service-tag use in documentation because tag membership changes outside your deployment pipeline. For high-assurance egress, compare a broad service tag with Private Endpoint plus private DNS; the latter can narrow access to a specific service instance rather than an entire service address set. After consolidation, run IP Flow Verify for representative allowed and denied tuples from each source group so the smaller rule set is proven equivalent to the previous policy.</p>""",
          8:"""<h3>Autoscale testing that resembles production</h3><p>Generate load with the same TLS profile, connection reuse, request size, and backend latency as the real application. Capacity units are influenced by throughput, current connections, and new connection rate, so a synthetic test that reuses one HTTP connection can dramatically understate a workload that creates many short TLS sessions. Watch backend response time alongside gateway capacity; if the backend slows, adding gateway instances can increase pressure on an already saturated application tier. For zonal resilience, run a failure exercise that removes or isolates one backend zone while load continues. The gateway can remain healthy but still return errors if the backend pool has no healthy capacity in surviving zones. Set autoscale maximum as part of an end-to-end capacity envelope: gateway, backend, database, and downstream APIs should all tolerate the request volume the edge is allowed to admit.</p>""",
          9:"""<h3>Safe rule-set release pattern</h3><p>Treat edge rules as application code. Store the intended condition/action order in source control, deploy to a nonproduction endpoint, and test a matrix containing matching, nonmatching, mixed-case, encoded-path, query-string, and header variants. Add the temporary version response header recommended by Microsoft so testers can prove which edge policy served the request. When a rule changes cache behavior, purge or account for cached objects before concluding the rule failed to propagate. When a rule overrides the origin group, verify health and TLS hostname behavior for the alternate origin before enabling the condition globally. For emergency rollback, keep the previous rule-set definition and route association ready rather than editing multiple actions manually under pressure. The goal is to make every transformation observable from client request through origin log, so edge behavior never becomes an undocumented second application.</p>""",
          10:"""<h3>Packet-level proof for clustered backends</h3><p>When Floating IP is used for a clustered service, capture traffic simultaneously at the load-balancer-facing NIC and the application listener. Confirm the destination IP presented to the guest is the frontend address and that the guest has a local/loopback binding for it. On Linux, review ARP and reverse-path settings required by the vendor; on Windows, verify the cluster role and weak-host behavior required by the documented pattern. Health probes should test a listener that represents the active service state, not merely an always-up operating-system port. During failover, verify the old active node stops answering the service and the new node becomes probe-healthy before production flows are accepted. Floating IP solves address mapping, but it does not arbitrate cluster ownership or synchronize application state. Keeping those responsibilities separate makes troubleshooting much faster.</p>""",
          11:"""<h3>Build a layered routing diagnosis</h3><p>Use Next Hop as the first route-selection question, then expand outward. If the result is VirtualAppliance, verify the appliance IP is reachable from the subnet and that IP forwarding is enabled on its NIC and inside the appliance. If the result is VirtualNetworkGateway, inspect whether the gateway actually learned or owns the destination prefix and whether the on-premises side has a return route. If the result is Internet when a forced-tunnel design expects an NVA, inspect route-table association and the 0.0.0.0/0 UDR. Pair the route result with IP Flow Verify for the exact five-tuple, then with Connection Troubleshoot or packet capture only after route and NSG policy are understood. This sequence prevents the common anti-pattern of running a packet capture on a VM for traffic Azure never routed to it in the first place.</p>""",
          12:"""<h3>Operational separation of inbound and outbound identities</h3><p>Document two public-IP sets explicitly: Firewall public addresses used for DNAT/platform operations and NAT Gateway V2 addresses used for permitted outbound flows. Partners that allowlist your egress must receive the NAT set, while clients consuming an inbound published service must continue using the Firewall frontend. Monitor both resources independently. A healthy Firewall rule log with failed outbound connections can still indicate NAT SNAT pressure; a healthy NAT Gateway says nothing about an inbound DNAT listener. During migration from Firewall-only SNAT, compare external source-IP observations before and after subnet association and coordinate allowlist changes so the new NAT addresses are accepted before production traffic moves. Because StandardV2 NAT Gateway cannot reuse Standard public IPs, plan re-IP explicitly rather than assuming the old Firewall egress address can simply be transferred.</p>"""}
          for i,x in extras.items():
              pat=rf'(<section class="lesson" id="l{i}">.*?)(<div class="sources">)'
