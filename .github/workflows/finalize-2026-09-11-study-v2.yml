          topics=['expressroute-ipv6-private-peering','vpn-gateway-az-sku-migration','virtual-wan-custom-hub-route-tables-labels','expressroute-microsoft-peering-route-filters','nat-gateway-snat-allocation-timers','azure-dns-caa-certificate-authority-authorization','nsg-augmented-rules-service-tags','application-gateway-v2-autoscaling-zones','front-door-rule-sets-edge-transformations','load-balancer-floating-ip-dsr','network-watcher-next-hop-diagnostics','azure-firewall-nat-gateway-v2-snat']; old=set(t for e in data['entries'] for t in e.get('topic_fingerprints',[])); dup=sorted(set(topics)&old)
