          extra={
          1:"""<h3>Authorization lifecycle and operational ownership</h3><p>An authorization should have the same lifecycle discipline as any other privileged connectivity object. Give it a name that identifies the consuming subscription or service, record who approved it, and avoid sending the key through a broad ticket or chat channel because possession of the key plus the circuit resource ID is what lets the consumer redeem the connection. Once an authorization is consumed, retain the relationship between that authorization name and the gateway connection in inventory. This becomes especially important when a central circuit carries dozens of VNets: an owner preparing to revoke an old authorization must be able to determine exactly which connection will disappear.</p><p>Cross-tenant use also changes troubleshooting ownership. The circuit team can prove that private peering and the circuit are healthy, while the workload team can prove that its ExpressRoute gateway is provisioned; neither fact alone proves the cross-subscription connection is valid. Establish a handoff checklist that includes the circuit resource ID, authorization status, gateway resource ID, connection status, and learned prefixes. For least privilege, the consumer does not need write access to the circuit after redemption. Conversely, the circuit owner does not need permission to configure subnets or workloads in the consuming subscription. Preserving that separation is one of the principal architectural benefits of authorization rather than granting broad cross-subscription RBAC.</p>""",
          2:"""<h3>Weight versus BGP attributes and ECMP</h3><p>Routing weight belongs to the Azure virtual-network connection object, so it is evaluated in a different administrative domain from BGP attributes learned over the ExpressRoute peering. Microsoft explicitly notes that connection weight is considered before AS-path length for VNet-to-on-premises selection. That matters when engineers try to make a remote circuit less attractive only by prepending their on-premises ASN: a higher Azure connection weight on that circuit can still produce the opposite of the intended path. Treat the weight and the advertised BGP attributes as one policy system and document which mechanism owns each direction.</p><p>Equal weights also deserve testing. When multiple eligible paths remain equivalent, Azure can use equal-cost routing behavior depending on the topology. That may be desirable for active/active bandwidth use but dangerous if the on-premises side contains stateful firewalls whose sessions are not synchronized. If the business requirement is deterministic primary/backup, give the connections deliberately different weights and make the CE return preference match. If the requirement is active/active, test many flows rather than a single ping because hashing behavior is visible only across multiple tuples. During maintenance, record the old weight before changing it, wait for route convergence, and confirm new flows follow the expected circuit before withdrawing the old path. Restore the original weight after the maintenance event instead of leaving a temporary routing preference as undocumented technical debt.</p>""",
          3:"""<h3>Capture design: outer tunnel versus inner payload</h3><p>A packet capture is most valuable when the filter reflects the exact hypothesis being tested. For an IKE-establishment problem, filter around the peer addresses and UDP 500/4500 so you can distinguish no arrival, one-way negotiation, and bidirectional exchange. For an application problem on an already-established tunnel, use the inner source and destination prefixes and application port. Mixing both questions in one broad capture produces a large trace but often less certainty. Record the test start and stop timestamps and run one controlled connection attempt while the capture is active.</p><p>NAT changes what you should expect to see. If VPN Gateway NAT translates an overlapping branch prefix before the packet enters the VNet, the inner packet on the Azure side can carry the translated address rather than the branch’s original address. Compare the configured NAT rules with the capture before concluding that a source address is unexpected. The same principle applies to NAT-T: seeing UDP 4500 rather than native ESP is normal when NAT traversal is in use. Finally, protect capture artifacts as operational data. Even when IPsec encrypts the outer transport, a capture point that exposes decrypted inner packets can reveal internal addressing, ports, and potentially payload. Store captures only as long as required for the incident and use a restricted storage destination.</p>""",
          4:"""<h3>Safe resize sequencing and rollback</h3><p>Adding an address prefix is usually easier to roll back than shrinking or replacing one. For an expansion, first reserve the new range in enterprise IPAM, add it to the VNet, synchronize every peer, verify that the new route appears, and only then create subnets and workloads inside it. This sequence ensures that no production VM is born into a prefix that its peers have not learned. For a contraction, evacuate workloads and dependent private endpoints before removing the range, because synchronization cannot preserve connectivity to addresses that no longer belong to the VNet.</p><p>Large peering meshes make synchronization an inventory problem. If VNet B is peered to ten other VNets, syncing only A-to-B fixes A but leaves nine peers stale. Query the peering list for B, identify every remote peer that carries full-VNet connectivity, and track completion per peer. Cross-tenant peerings also require the operator performing synchronization to have the necessary permissions across the administrative boundary. After sync, test both control-plane metadata and traffic. A correct remoteAddressSpace proves the peer knows the new CIDR; the effective route table proves the NIC has consumed it; an application or TCP probe proves security and host configuration allow the new subnet. Keeping those three checks separate avoids recreating a healthy peering when the actual problem is an NSG or application listener.</p>""",
          5:"""<h3>Deployment scope, ownership, and drift</h3><p>AVNM routing configurations are deployed to selected Azure regions, so network-group membership by itself is not the final activation step. A VNet can satisfy the group definition but still lack the intended managed route state if the routing configuration was not deployed to that VNet’s region. Treat the deployment object as a release artifact: record which routing-configuration version was deployed, to which regions, and when. This is particularly important for enterprises that use dynamic network-group membership because a newly tagged VNet can become a member after the original routing design was approved.</p><p>Drift management is different from ordinary Terraform-owned route tables. AVNM may create and manage route tables while preserving unrelated customer routes. That coexistence is useful, but it means an engineer can manually add a UDR that changes forwarding even though the centralized configuration still reports successful deployment. Build a periodic audit that compares the effective route on representative NICs with the intended AVNM rule set. For firewall insertion, include both directions in the policy design: spoke-to-hub/default routes may steer egress toward the firewall, while gateway-subnet routes can be required to steer hybrid traffic toward the same inspection point. If only one side is managed, stateful sessions can become asymmetric even though every individual UDR looks reasonable in isolation.</p>""",
          6:"""<h3>Capacity, DNS, and consumer onboarding</h3><p>Capacity planning for Application Gateway Private Link has a concrete unit: each IP address in the Private Link configuration supports 65,536 concurrent TCP connections and Microsoft permits up to eight IPs in the configuration. Do not translate that directly into “65,536 users,” because one browser or application can maintain many simultaneous connections. Estimate concurrent flows, account for retries and connection pooling, and watch connection growth during onboarding. Because the IPs are dynamically allocated, design capacity through the number of configuration IPs rather than by expecting fixed addresses inside the provider subnet.</p><p>The consumer still needs a stable name-resolution strategy. A Private Endpoint supplies an IP in the consumer VNet, but Application Gateway listeners continue to evaluate host names and TLS settings. Publish an internal DNS name that resolves to the consumer’s endpoint IP, then make the request with the hostname expected by the listener and certificate. Connecting directly to the endpoint IP may reach the gateway but select the wrong multisite listener or fail certificate validation. In cross-tenant onboarding, keep the provider’s approval workflow and the consumer’s DNS workflow separate: Approved confirms the Private Link relationship, while correct DNS confirms that applications actually use it. The LinkID in access logs is then the best correlation key when multiple consumers use overlapping RFC1918 source addresses.</p>""",
          7:"""<h3>Health-probe tuning without masking failures</h3><p>The sample-size algorithm lets you trade detection speed for stability. With SampleSize 4 and SuccessfulSamplesRequired 3, one recent failure does not immediately evict an origin, but two failures in the four-sample window can. A smaller interval detects changes faster but generates more probes from distributed Front Door locations. Tune these values against the application’s failure characteristics rather than copying a universal template. An origin that needs sixty seconds to recover from deployment should not flap in and out every few seconds because its health endpoint transiently returns errors during startup.</p><p>Priority and weight apply after health eligibility, which is why changing a weight is not the correct response to a failing probe. Priority is useful for active/passive designs, while weight distributes among otherwise eligible origins at the same priority. Session affinity can then preserve a user’s selected origin, but it should not override health. For stateful applications, test what happens when the affinitized origin becomes unhealthy: the client must be able to establish state on another origin or the global routing layer has succeeded while the application experience still fails. Also monitor probe requests separately from customer requests in origin logs so synthetic health traffic does not distort business request metrics.</p>""",
          8:"""<h3>DNSSEC, apex records, and failover timing</h3><p>Linked Records are especially interesting at the DNS zone apex. DNS protocol rules do not permit an ordinary CNAME at the apex because it would conflict with SOA and NS records. A Linked Record can expose Traffic Manager selection there without returning a client-visible CNAME, so an organization can use its bare domain while retaining health-based endpoint selection. The same flattening makes the integration compatible with DNSSEC validation: the Azure DNS zone signs the answer it serves rather than sending the validator through an unsigned Traffic Manager CNAME hop.</p><p>Failover timing still depends on two clocks: Traffic Manager endpoint health detection and recursive/client DNS caching. A 30-second profile TTL does not mean traffic moves exactly thirty seconds after a backend fails. The monitor must first decide that the endpoint is degraded, then cached answers must age out. Test with a resolver that exposes TTLs and query repeatedly through a controlled endpoint failure. Also consider strict typing during migrations. If an A-linked profile is serving IPv4 addresses, adding a hostname-only or IPv6-only endpoint is a schema/design problem, not merely another endpoint. Build separate profiles/records where address families or target types differ, and remember the current preview limit of 50 linked records per profile when centralizing many application names.</p>""",
          9:"""<h3>Route specificity, SNAT, and inspection symmetry</h3><p>Private Endpoint inspection often requires more than steering the forward packet through a firewall. The service-side return behavior and the firewall’s state table must see a coherent session. Microsoft recommends SNAT in several Azure Firewall Private Link inspection patterns because it makes the return traffic reliably target the firewall rather than trying to reach the original client through a path that can bypass the inspection point. Application rules in Azure Firewall perform SNAT for this scenario; when network rules are used, review the documented SNAT private-range configuration so the return path remains symmetric.</p><p>Choose the inspection UDR based on the Private Endpoint VNet’s address space, not on intuition that “more specific is always /32.” Microsoft’s network-policy documentation allows UDR override when the route prefix meets the required specificity relative to the VNet address space. Grouping endpoints into a dedicated subnet can therefore make operations simpler: one route for that endpoint subnet can steer several endpoints through the appliance, rather than maintaining a /32 per endpoint. Validate each destination with the client NIC effective route table after any endpoint or subnet change.</p><p>NSG enforcement is a separate decision. Once Private Endpoint network policies are enabled, NSG rules can deny traffic that previously bypassed those policies. Stage this change with explicit allows for legitimate client networks before enabling enforcement in a production endpoint subnet. If a route change and an NSG change are applied together, a timeout becomes ambiguous; changing one control at a time makes the expected failure evidence much easier to interpret.</p>""",
          10:"""<h3>Group design, CI/CD, and blast radius</h3><p>Because one IP Group can be referenced by many firewall rules, its blast radius can be larger than the apparent one-line address change. Before adding a new prefix, search the firewall policy for every rule collection that consumes the group and classify the effect. Adding 10.30.0.0/16 to a source group used by both an HTTPS allow rule and an administrative SSH rule may unintentionally grant the new site both capabilities. If memberships have different trust levels, split the group rather than relying on rule authors to remember every downstream reference.</p><p>For CI/CD, validate addresses before calling Azure: reject invalid CIDRs, normalize duplicates, and enforce an upper bound appropriate to your organization. Then update groups in controlled batches and query each group’s provisioningState afterward. Microsoft allows up to 20 parallel IP Group updates, but parallelism should not prevent deterministic rollback. Store the previous membership in the pipeline artifact or source control so a failed change can restore exactly the old set.</p><p>IP Groups can also improve audit readability. A rule that says source <code>branch-sites</code> to destination <code>payment-backends</code> communicates intent more clearly than forty raw prefixes. Keep names semantic and avoid embedding environment-specific addresses in the name itself. When application ownership changes, the group membership can move without forcing a firewall-rule rename, which keeps historical policy reviews understandable.</p>""",
          11:"""<h3>Measurement methodology and service compatibility</h3><p>Routing preference should be evaluated with measurements from the networks that actually matter to the application. Run traceroute or equivalent path tests and latency measurements from representative user ISPs in each geography, and repeat them over time because public-Internet routing changes. Compare the two preferences using endpoints in the same Azure region and with equivalent application stacks. If one test uses a cached CDN path and another hits an uncached VM, the result says little about backbone versus transit routing.</p><p>The immutable nature of the public-IP setting means migration planning matters. For a production frontend, create a second compatible public IP with the desired preference, attach it through the service’s supported change process, update DNS where necessary, and preserve the old address through its TTL/rollback period. Do not delete the old address first and discover afterward that the target service does not support the Internet preference. Check the current compatibility matrix before design approval: Internet routing preference is IPv4 only and has exclusions such as NAT Gateway and IP-based public Load Balancer scenarios.</p><p>Security controls remain independent. Both preferences still use public Internet addresses, so NSGs, Azure Firewall/WAF, DDoS protections, and application TLS requirements do not disappear. The feature selects the transit path economics and performance boundary; it does not turn a public endpoint into private connectivity or change the application’s exposure model.</p>""",
          12:"""<h3>Application behavior, SNAT, and observability</h3><p>Idle timeout is easiest to diagnose with a reproducible application timeline. Open a TCP connection, verify bidirectional data, leave it silent for longer than the configured threshold, then send one more packet while capturing both endpoints. With TCP reset enabled, the expected evidence is an RST that closes the stale connection and lets the application reconnect immediately. Without reset, the first post-idle packet can disappear and the client may spend seconds or minutes retransmitting before its own socket timeout fires. That difference is visible in packet capture even when the application logs only a generic connection exception.</p><p>Outbound rules add another consideration: SNAT port state. A large population of idle outbound connections consumes translation state until the timeout expires. Raising an outbound idle timeout can therefore increase the duration that SNAT mappings remain occupied. Capacity planning should consider both user experience and port consumption, especially for large VM pools talking to a small set of external destinations. Keepalive traffic can preserve a needed session, but it also keeps the corresponding state alive and generates packets across every stateful device in the path.</p><p>Finally, identify the shortest timeout in the entire chain. Application Gateway, firewalls, proxies, Private Link components, operating systems, and remote servers can each expire state independently. If a connection consistently dies at five minutes while the Load Balancer is configured for fifteen, the Load Balancer is unlikely to be the active timer. Use packet timing and device logs to locate the component that actually sends the reset or begins silently dropping the flow.</p>"""}
          # Per-lesson source collision corrections and targeted enrichment.
          reps={1:{'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm':'https://learn.microsoft.com/en-us/azure/expressroute/how-to-expressroute-direct-portal'},2:{'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-cli':'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-optimize-routing'},4:{'https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview':'https://learn.microsoft.com/en-au/training/modules/integrate-vnets-with-vnet-peering/'},9:{'https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview#network-security-of-private-endpoints':'https://learn.microsoft.com/en-us/azure/firewall-manager/private-link-inspection-secure-virtual-hub'}}
          for n in range(1,13):
              m=re.search(rf'(<section class="lesson" id="l{n}">)(.*?)(</section>)',s,re.S)
              if not m: raise SystemExit(f'missing L{n}')
              sec=m.group(2)
              for a,b in reps.get(n,{}).items(): sec=sec.replace(a,b)
              sec=sec.replace('<h3>Verification</h3>',extra[n]+'<h3>Verification</h3>',1)
              s=s[:m.start(2)]+sec+s[m.end(2):]
          sources={1:'https://learn.microsoft.com/en-us/azure/expressroute/how-to-expressroute-direct-portal',2:'https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing',3:'https://learn.microsoft.com/en-us/azure/vpn-gateway/packet-capture',4:'https://learn.microsoft.com/en-au/training/modules/integrate-vnets-with-vnet-peering/',5:'https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-user-defined-route',6:'https://learn.microsoft.com/en-us/azure/application-gateway/private-link',7:'https://learn.microsoft.com/en-us/azure/frontdoor/health-probes',8:'https://learn.microsoft.com/en-us/Azure/dns/dns-traffic-manager-linked-records',9:'https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy',10:'https://learn.microsoft.com/en-us/azure/firewall/ip-groups',11:'https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-overview',12:'https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-idle-timeout'}
          if 'const lessonSources=' not in s:
              s=s.replace('const q=[','const lessonSources='+json.dumps(sources,separators=(',',':'))+';const q=[',1)
              old="r.appendChild(d)})}function check(i)"
              new="const a=document.createElement('a');a.className='small';a.href=lessonSources[x[1]];a.target='_blank';a.rel='noopener';a.textContent='Question source';d.appendChild(a);r.appendChild(d)})}function check(i)"
              if old not in s: raise SystemExit('quiz insertion point missing')
              s=s.replace(old,new,1)
          P.write_text(s)
          lessons=re.findall(r'<section class="lesson" id="l(\d+)">(.*?)</section>',s,re.S); errors=[]; counts={}
          if len(lessons)!=12: errors.append('lesson count')
          for num,sec in lessons:
              for h in ['Why it matters','Architecture','Prerequisites and implementation','Verification','Troubleshooting']:
                  if h not in sec: errors.append(f'L{num} missing {h}')
              if re.search(r'<h3>\s*(Summary|Exam and interview takeaways)',sec,re.I): errors.append(f'L{num} banned section')
              t=re.sub(r'<pre\b.*?</pre>|<figure\b.*?</figure>|<div class="sources".*?</div>|<h[1-6]\b.*?</h[1-6]>',' ',sec,flags=re.S|re.I)
              t=hm.unescape(re.sub(r'<[^>]+>',' ',t)); c=len(re.findall(r"\b[\w][\w'./:-]*\b",t)); counts[int(num)]=c
              if c<700: errors.append(f'L{num} words={c}')
              ps=[hm.unescape(re.sub(r'<[^>]+>',' ',x)) for x in re.findall(r'<p\b[^>]*>(.*?)</p>',sec,re.S|re.I)]
              ps=[' '.join(x.lower().split()) for x in ps if len(x.split())>=35]
              for i in range(len(ps)):
                  for j in range(i+1,len(ps)):
                      if difflib.SequenceMatcher(None,ps[i],ps[j]).ratio()>.90: errors.append(f'L{num} duplicate p{i+1}/p{j+1}')
          refs=re.findall(r'<img src="(images/2026-09-10-09-00-L\d\d-[^"]+\.svg)"',s)
          if len(refs)!=12 or len(set(refs))!=12: errors.append(f'svg refs {len(refs)}')
          if '.diagram img{display:block;width:100%;height:auto}' not in s: errors.append('full width css')
          for n in range(1,13):
              pref=f'2026-09-10-09-00-L{n:02d}-'; ds=list(Path('docs/images').glob(pref+'*.drawio')); vs=list(Path('docs/images').glob(pref+'*.svg'))
              if len(ds)!=1 or len(vs)!=1: errors.append(f'L{n} asset pair'); continue
              if 'mxgraph.azure' not in ds[0].read_text(): errors.append(f'L{n} azure stencil')
              if not vs[0].read_text().lstrip().startswith('<svg'): errors.append(f'L{n} svg')
          qm=re.search(r'const q=\[(.*?)\];function shuffle',s,re.S)
          if not qm: errors.append('quiz missing'); dist={}
          else:
              qb=qm.group(1); dist={k:len(re.findall(r'\['+k+r',',qb)) for k in 'HCRS'}
              if dist!={'H':15,'C':13,'R':10,'S':12}: errors.append(f'quiz dist {dist}')
          for token in ['Check answer','Finish and grade','Unanswered','Domain breakdown','Answer review','Reset','Question source']:
              if token not in s: errors.append('missing '+token)
          primary=list(sources.values())
          scenario=['https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-cli','https://learn.microsoft.com/en-us/azure/expressroute/expressroute-optimize-routing','https://learn.microsoft.com/en-us/azure/vpn-gateway/troubleshoot-vpn-with-azure-diagnostics','https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-peering-sync-route-issues','https://learn.microsoft.com/en-us/azure/virtual-network-manager/how-to-create-user-defined-route','https://learn.microsoft.com/en-us/azure/application-gateway/private-link-configure','https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods','https://learn.microsoft.com/en-us/Azure/dns/tutorial-traffic-manager-linked-records-portal','https://learn.microsoft.com/en-us/azure/firewall-manager/private-link-inspection-secure-virtual-hub','https://learn.microsoft.com/en-us/azure/firewall/create-ip-group','https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-portal','https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset']
          if len(set(x.lower() for x in primary+scenario))!=24: errors.append('source pair distinctness')
          d=json.loads(Path('docs/azure-study-uniqueness-ledger.json').read_text()); blocked=set(); canon=lambda u:u.split('#',1)[0].rstrip('/').lower()
          for e in d.get('entries',[]):
              for k in ('primary_article_urls','scenario_article_urls','canonical_urls'): blocked.update(canon(x) for x in e.get(k,[]))
          col=[u for u in primary+scenario if canon(u) in blocked]
          if col: errors.append('30d URL collision '+str(col))
          val={'lesson_count':len(lessons),'substantive_word_counts':counts,'question_distribution':dist,'question_count':sum(dist.values()) if dist else 0,'diagram_pairs':12,'source_urls':24,'errors':errors}
          Path('docs/.azure-study-2026-09-10-validation.json').write_text(json.dumps(val,indent=2)); print(json.dumps(val,indent=2))
          if errors: sys.exit(1)
          PY
