name: Assemble Azure Study Report 2026-09-05
on:
  push:
    paths:
      - 'docs/.azure-report-build-trigger-2026-09-05'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate report
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, re, json, sys
          root=pathlib.Path('.')
          parts=sorted((root/'docs').glob('.azure-report-payload-20260905.part*'))
          if len(parts)!=5:
              raise SystemExit(f'Expected 5 payload parts, got {len(parts)}')
          b64=''.join(p.read_text().strip() for p in parts)
          html=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          if html.count('class="lesson"') != 12:
              raise SystemExit('Lesson count validation failed')
          if html.count('class="mermaid"') < 12:
              raise SystemExit('Mermaid count validation failed')
          if 'Finish and grade' not in html or 'Reset quiz' not in html or 'Check answer' not in html:
              raise SystemExit('Quiz control validation failed')
          # Validate embedded question array count and requested domain distribution.
          m=re.search(r'const questions=(\[.*?\]);\nfunction seeded', html, re.S)
          if not m:
              raise SystemExit('Question data missing')
          q=json.loads(m.group(1))
          if len(q)!=50:
              raise SystemExit(f'Question count {len(q)} != 50')
          from collections import Counter
          expected={'Hybrid connectivity and architecture':15,'Core networking infrastructure':13,'Routing and traffic management':10,'Security, monitoring, and private service access':12}
          if Counter(x['domain'] for x in q) != expected:
              raise SystemExit('Domain distribution mismatch')
          out=root/'docs'/'Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-05-08-00.html'
          out.write_text(html,encoding='utf-8')
          print(f'Wrote {out} bytes={len(html.encode())}')
          PY
      - name: Commit assembled report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-05-08-00.html
          git commit -m 'Assemble validated Azure networking study report 2026-09-05 [skip ci]' || exit 0
          git push
