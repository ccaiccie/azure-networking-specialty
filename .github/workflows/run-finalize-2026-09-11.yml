name: Run September 11 finalizer
on:
  push:
    paths:
      - '.github/workflows/run-finalize-2026-09-11.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and update report
        run: python scripts/finalize_20260911_v2.py
      - name: Commit validated report
        run: |
          git config user.name "azure-study-automation"
          git config user.email "azure-study-automation@users.noreply.github.com"
          git add docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-11-08-00.html docs/azure-study-uniqueness-ledger.json docs/images/2026-09-11-08-00-L06-dns-alias.svg docs/images/2026-09-11-08-00-L06-dns-alias.drawio
          git commit -m "Finalize validated September 11 Azure networking study report"
          git push
