name: Append Azure Study Ledger 2026-09-05
on:
  push:
    paths:
      - 'docs/.azure-ledger-trigger-2026-09-05'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append validated run to ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('docs/azure-study-uniqueness-ledger.json')
          ledger=json.loads(p.read_text())
          entry=json.loads(pathlib.Path('docs/.azure-ledger-entry-20260905.json').read_text())
          if not any(x.get('run_id')==entry['run_id'] for x in ledger.get('entries',[])):
              ledger.setdefault('entries',[]).append(entry)
          p.write_text(json.dumps(ledger,indent=2)+"\n")
          print('entries',len(ledger['entries']))
          print('last_run_id',ledger['entries'][-1]['run_id'])
          PY
      - name: Commit ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/azure-study-uniqueness-ledger.json
          git commit -m 'Advance Azure study uniqueness ledger 2026-09-05 [skip ci]' || exit 0
          git push
