name: Validate Azure Daily Study Report
on:
  push:
    paths:
      - 'docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'
      - 'docs/images/**'
      - '.github/workflows/validate-azure-study-report.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate latest report
        shell: python
        run: |
          import glob, html, os, re, sys
          from html.parser import HTMLParser

          files=sorted(glob.glob('docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'))
          if not files:
              raise SystemExit('FAIL: no report files')
          path=files[-1]
          raw=open(path,encoding='utf-8').read()

          class LessonParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_lesson=False; self.depth=0; self.skip=0; self.words=[]; self.counts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='section' and 'lesson' in a.get('class','').split():
                      self.in_lesson=True; self.depth=1; self.words=[]; return
                  if self.in_lesson:
                      self.depth+=1
                      if tag in {'h1','h2','h3','h4','h5','h6','pre','code','figure','script','style'} or (tag=='div' and 'sources' in a.get('class','').split()): self.skip+=1
              def handle_endtag(self,tag):
                  if self.in_lesson:
                      if tag in {'h1','h2','h3','h4','h5','h6','pre','code','figure','script','style'} and self.skip: self.skip-=1
                      self.depth-=1
                      if tag=='section' and self.depth==0:
                          text=' '.join(self.words)
                          self.counts.append(len(re.findall(r"\b[\w’'-]+\b", text)))
                          self.in_lesson=False
              def handle_data(self,data):
                  if self.in_lesson and not self.skip: self.words.append(data)

          p=LessonParser(); p.feed(raw)
          lesson_count=len(p.counts)
          svg_refs=re.findall(r'<img[^>]+src="images/([^"]+\.svg)"',raw)
          drawio_refs=re.findall(r'href="images/([^"]+\.drawio)"',raw)
          q_match=re.search(r'const Q=\[(.*?)\];function sh',raw,re.S)
          q_block=q_match.group(1) if q_match else ''
          q_count=len(re.findall(r'^\[(?:H|C|R|S),',q_block,re.M))
          dist={k:len(re.findall(r'^\['+k+r',',q_block,re.M)) for k in 'HCRS'}
          missing=[x for x in svg_refs+drawio_refs if not os.path.exists('docs/images/'+x)]
          non_svg=[]
          for x in svg_refs:
              txt=open('docs/images/'+x,encoding='utf-8').read().lstrip()
              if not txt.startswith('<svg'): non_svg.append(x)
          bad_drawio=[]
          for x in drawio_refs:
              txt=open('docs/images/'+x,encoding='utf-8').read()
              if 'mxgraph.azure.' not in txt: bad_drawio.append(x)
          forbidden=bool(re.search(r'<h3>\s*(Exam and interview takeaways|Summary)\s*</h3>',raw,re.I))
          fullwidth='.diagram img{display:block;width:100%;height:auto}' in raw
          fonts=all(s in raw for s in ['font:14.5px/1.56','h1{font-size:30px','h2{font-size:23px','h3{font-size:18px','font-size:13px'])
          print('REPORT',path)
          print('LESSON_COUNT',lesson_count)
          print('WORD_COUNTS',','.join(map(str,p.counts)))
          print('MIN_WORD_COUNT',min(p.counts) if p.counts else 0)
          print('SVG_REFS',len(svg_refs),'DRAWIO_REFS',len(drawio_refs))
          print('QUIZ_COUNT',q_count,'DIST',dist)
          print('MISSING_ASSETS',missing)
          print('BAD_SVG',non_svg,'BAD_DRAWIO',bad_drawio)
          print('FORBIDDEN_SECTIONS',forbidden,'FULLWIDTH',fullwidth,'FONTS',fonts)
          ok=(lesson_count==12 and len(p.counts)==12 and min(p.counts)>=700 and len(svg_refs)==12 and len(drawio_refs)==12 and not missing and not non_svg and not bad_drawio and q_count==50 and dist=={'H':15,'C':13,'R':10,'S':12} and not forbidden and fullwidth and fonts)
          print('VALIDATION', 'PASS' if ok else 'FAIL')
          if not ok: sys.exit(1)
