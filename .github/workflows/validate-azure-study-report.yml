name: Validate Azure Daily Study Report
on:
  push:
    paths:
      - 'docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'
      - 'docs/images/**'
      - '.github/workflows/validate-azure-study-report.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce depth and validate latest report
        shell: python
        run: |
          import glob, html, json, os, re
          files=sorted(glob.glob('docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'))
          if not files: raise SystemExit('No report files')
          path=files[-1]
          raw=open(path,encoding='utf-8').read()
          extra="[C,10,'A new VNet exists in ARM but not topology yet. What is plausible?',['Resource Graph/topology propagation delay','The VNet is definitely broken','BGP must be down','DNS alias failure'],0,'Microsoft notes topology can lag recent changes.','https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-topology'],"
          raw=raw.replace(extra,'',1)
          additions={
          1:"""<h3>IPv6 migration and route-policy design</h3><p>For production migration, treat IPv6 as a separate rollout program rather than merely adding an address family. Start by defining which on-premises aggregates are permitted into Azure and which Azure IPv6 prefixes may enter the enterprise. Apply maximum-prefix and prefix-list safeguards on the customer edge so a configuration error cannot turn private peering into an accidental transit path. Test both links independently because a dual-stack service can hide a single-link IPv6 defect while IPv4 continues balancing normally. Also verify every intermediate NVA, firewall, monitoring product, and DNS resolver understands IPv6. A device that forwards IPv4 but silently ignores IPv6 produces an application symptom that looks unrelated to ExpressRoute. During change control, capture route counts and BGP states for all four sessions—IPv4 primary/secondary and IPv6 primary/secondary—and keep those values as the rollback baseline. Once routing is stable, publish AAAA records only for applications that have passed listener, certificate, firewall, and return-path testing. This staged sequence prevents DNS from steering users onto an IPv6 path before the complete application chain is ready.</p>""",
          2:"""<h3>Policy scope and operational safeguards</h3><p>Route filters should be managed as a controlled subscription list rather than as a one-time peering setting. Keep a change record that maps each selected BGP community to the business service that depends on it, the approximate route-count impact, and the Internet fallback behavior. That makes route withdrawals explainable when a community is removed later. On the customer edge, use inbound filtering and route-policy boundaries so Microsoft public-service routes do not automatically leak into unrelated routing domains. If a selected service has both ExpressRoute and Internet reachability, document which path should be preferred and how failback behaves after the private path returns. A useful test is to choose one IP prefix from every subscribed community and prove its next hop before and after the filter change. Also capture the total received-prefix count; a large unexpected jump is a signal to review the selected communities before propagating routes internally. When troubleshooting, separate three questions: is Microsoft peering BGP established, is the filter associated, and does the filter contain the current service community? Those checks isolate transport, attachment, and policy-content failures without unnecessary changes to ASN, VLAN, or customer prefix advertisements.</p>""",
          3:"""<h3>Client lifecycle, DNS, and access-policy design</h3><p>Remote-access operations should include profile lifecycle and identity lifecycle as separate controls. A gateway configuration change can require a newly generated client profile even when user accounts are unchanged, while an Entra policy change can block authentication without changing the VPN profile at all. Maintain a small pilot group that receives profile changes first, and record the expected client address pool, pushed routes, DNS servers, and tunnel protocol so support engineers can compare a failing workstation against a known-good baseline. For hybrid DNS, test both forward and reverse dependencies: the VPN client must reach the resolver, and the resolver must know how to answer or forward Azure private and on-premises namespaces. If Conditional Access is used, validate the exact sign-in event and policy result in Entra rather than diagnosing every failed connection from the VPN client message alone. For security segmentation, use the assigned P2S address pool as an explicit source in NSG or firewall policy where appropriate. That allows authenticated remote users to receive narrower access than branch networks even though both ultimately traverse Azure routing. Finally, test profile revocation and user disablement so the organization understands how quickly an already established session is affected.</p>""",
          4:"""<h3>Route-map change control and attribute visibility</h3><p>Before applying a Route Map, export the learned and advertised route views for the affected connection and identify several representative prefixes that should match and several that must not match. This gives you a deterministic test set for rule order. If a rule changes community or AS path, verify the downstream device actually receives and uses that attribute; a control-plane mutation has little value if the next routing domain discards it. For summarization, compare the summary against the complete list of component routes and record which device is responsible for discarding traffic to absent components. A summary without a matching discard/null strategy can create loops or unpredictable fallback. When multiple rules exist, use narrow matches before broad matches and leave intentional gaps rather than creating an all-purpose final manipulation that obscures policy. Because Route Maps are attached per connection and direction, identical-looking connections can legitimately have different inbound and outbound policy. Name maps and rules so direction and purpose are visible in logs and configuration review. During rollback, remove or restore the association first, then verify route attributes and reachability before deleting the Route Map object itself; that preserves an easy return path if the policy must be reapplied.</p>""",
          5:"""<h3>Lifecycle behavior and failure-domain limits</h3><p>Alias records are most valuable when the target resource lifecycle is automated. In Terraform, the resource ID dependency means a plan shows both infrastructure and DNS relationship changes together, which reduces the chance that a public IP replacement leaves DNS pointing at an obsolete literal address. Still, plan for resolver caching: the alias target can change immediately in Azure while users continue seeing the prior answer until TTLs expire. During a planned cutover, lower the TTL ahead of time if rapid convergence is necessary, but restore a normal caching value afterward to avoid unnecessary resolver load. Record the supported target type and do not assume every Azure resource can be an alias destination. When a shared target is referenced by many aliases, track the documented per-resource alias limit before onboarding more names. For troubleshooting, compare three pieces of evidence in order: the alias record’s target resource ID, the target resource’s current address, and the authoritative DNS answer. If those agree but a client differs, investigate recursive or local caching. If the authoritative answer is correct but HTTPS fails, move to certificate, listener, health, or application policy; DNS has already done its job.</p>""",
          6:"""<h3>Private listener, DNS, and backend isolation design</h3><p>A private-only gateway should be treated as the application’s authoritative ingress point inside the enterprise. Internal DNS should resolve the service name to the gateway frontend, and backend servers should normally reject direct client access unless a documented management path requires it. This prevents users from bypassing WAF, TLS policy, header rewriting, or centralized health checks simply because they know a backend IP. In hybrid deployments, include the Application Gateway subnet in route advertisements and verify return routing from the gateway to branch clients when backend responses are proxied. Capacity planning must also account for autoscale: the dedicated subnet must have enough free addresses for scale-out and maintenance operations, not just the current instance count. For TLS re-encryption, validate the backend certificate name and trust chain from the gateway’s perspective, which is different from the browser-to-listener certificate. Health probes should exercise a lightweight endpoint that represents application readiness; a generic TCP-open test can mark a backend healthy while the real application is unavailable. During maintenance, remove or fail a backend through the probe path and confirm new sessions move to healthy members without changing the private frontend DNS record.</p>""",
          7:"""<h3>Backend operating-system behavior and failover testing</h3><p>Floating IP designs are complete only when the guest configuration is included in the runbook. Document the exact frontend address that must exist on the backend, the interface or loopback where it is configured, ARP/neighbor-discovery behavior, and any weak-host or vendor-specific setting required to accept traffic for an address that is not the primary NIC address. Build an automated node-comparison check so a replacement or scaled-out instance cannot join the backend pool without the same Floating IP configuration. During failover testing, verify more than the Azure probe: move application ownership to another backend, confirm that backend becomes Healthy, confirm the frontend address is bound correctly, and establish a fresh client session. Existing sessions may behave differently depending on the workload’s own clustering or state-replication technology, so record whether graceful session preservation is expected or only new-session recovery. If one node works and another times out under identical load-balancer state, compare guest networking before changing Azure. Also verify outbound design separately; Floating IP is an inbound mapping feature and should not be assumed to provide deterministic SNAT or Internet egress for backend hosts.</p>""",
          8:"""<h3>Defense-in-depth and bypass testing</h3><p>Origin lockdown should be validated as an explicit bypass test, not inferred from Front Door health. Maintain two test paths: one request through the public Front Door hostname and one request sent directly to the origin hostname or public address. The first must succeed and the second must fail. Where the origin platform supports header-conditioned access restrictions, test a mismatched <code>X-Azure-FDID</code> value as well; this proves that the rule trusts the intended profile rather than every Front Door deployment. Rule priority matters on App Service access restrictions, so ensure a broader allow rule does not precede the Front Door-specific rule and unintentionally reopen the origin. Keep an emergency administrative path that is narrow, time-bounded, and separately authenticated rather than leaving a permanent broad IP allow. Monitor 403 responses from Front Door probes because they often indicate an origin restriction mismatch, while connection timeouts point more toward network access. If multiple Front Door profiles legitimately share the origin, document each approved FDID or use a design that intentionally supports that pattern. For stronger isolation, compare this public-endpoint model with Premium Private Link rather than weakening the access restrictions.</p>""",
          9:"""<h3>Building a route-evidence workflow</h3><p>Next Hop becomes most useful when it is paired with a small library of canonical destinations. For each important subnet, keep tests for an Internet IP, an on-premises prefix, a peered VNet prefix, and a destination that must traverse inspection. Run those tests before and after route-table, peering, gateway, or BGP changes. The resulting next-hop type and address are concise evidence of whether the intended policy changed. When the answer is unexpected, immediately query the effective route table and identify the winning prefix, source, and next-hop type rather than editing the route table by intuition. Remember that Next Hop evaluates one destination, so a successful result for 10.20.1.10 does not prove 10.20.2.10 follows the same route if a more-specific prefix exists. For NVA designs, verify both directions with suitable source VMs because Azure can select the correct forward appliance while the return side follows another route. Store the command output with incident timestamps; later BGP or UDR changes can otherwise make the current route table differ from the state that existed during the failure.</p>""",
          10:"""<h3>Using topology without mistaking inventory for telemetry</h3><p>Topology is most effective as the first page of an investigation runbook. Use it to identify the resource IDs and relationships that define the suspected path, then pivot to tools that measure behavior. For example, a topology may reveal a VNet peering, route table, internal load balancer, firewall NIC, and private endpoint. The next steps should be effective routes or Next Hop for forwarding, IP Flow Verify for NSG policy, backend health for load balancing, and logs or packet capture for actual traffic. Keep scope and permissions in mind: an engineer with access to only one subscription can see an incomplete architecture and may wrongly conclude that a dependency does not exist. Include subscription IDs and resource groups in exported investigation notes so teams can reproduce the view. After major network changes, compare topology with an authoritative resource inventory but allow for Resource Graph propagation delay. If a recently deleted relationship still appears, verify with direct ARM/CLI before assuming deletion failed. Conversely, if a newly created object is absent from topology but direct resource queries show <code>Succeeded</code>, continue troubleshooting with direct diagnostics instead of waiting for the visual map to update.</p>""",
          11:"""<h3>Rule design, logging, and false-positive control</h3><p>Custom rules should be written so an operator can explain exactly which request property caused the match. Avoid conditions that combine many unrelated variables merely to reduce rule count; smaller purpose-specific rules are easier to test and safer to reorder. For every Block rule, create a positive request that should match and a negative request that differs by one property, then verify WAF logs record the expected rule name and action. For Allow rules, be especially cautious because a terminating allow can prevent managed rules from inspecting the request. Where the goal is to exempt a known false positive from one managed rule, a targeted managed-rule exclusion may preserve more protection than a broad custom Allow. Keep rule priorities sparse enough that new rules can be inserted without renumbering the entire policy. In production, correlate WAF request IDs with application logs so a 403 can be traced from the edge decision to the attempted backend transaction. If legitimate users are blocked after a rule change, first identify whether the custom rule or a managed rule matched; changing the wrong layer can create a security gap without fixing the original request.</p>""",
          12:"""<h3>Policy hierarchy, inheritance, and logging discipline</h3><p>Firewall Policy troubleshooting is easier when every rule collection group has a documented purpose and a reserved priority range. Keep emergency or organization-wide controls in a clearly identified low-number range, application-specific policy in another range, and broad catch-all policy later. If parent and child policies are used, include inherited groups in the operational view so engineers do not search only the child policy for a rule that actually lives in the parent. For every important flow, record the expected rule family: DNAT for inbound publication, network rules for protocol/IP controls, and application rules for supported FQDN-oriented traffic. Then query logs for the exact source, destination, protocol, and action to confirm which rule decided the session. A successful policy deployment means only that Azure accepted the configuration; it does not prove a particular packet reached the firewall. If there is no matching firewall log, use Next Hop and effective routes before creating more rules. When a log shows an earlier deny, modify the policy deliberately rather than adding a later allow that can never be reached. This discipline keeps the rulebase predictable as priorities and inherited policies grow.</p>"""
          }
          for n,addition in additions.items():
              marker=f'data-depth-extension="{n}"'
              sec_re=re.compile(r'(<section class="lesson" id="l'+str(n)+r'">.*?)(<h3>Verification</h3>)',re.S)
              m=sec_re.search(raw)
              if m and marker not in m.group(1):
                  ins=f'<div {marker}>{addition}</div>'
                  raw=raw[:m.start(2)]+ins+raw[m.start(2):]
          open(path,'w',encoding='utf-8').write(raw)

          lessons=re.findall(r'<section class="lesson"[^>]*>(.*?)</section>',raw,re.S)
          counts=[]
          for lesson in lessons:
              s=re.sub(r'<figure\b.*?</figure>',' ',lesson,flags=re.S|re.I)
              s=re.sub(r'<pre\b.*?</pre>',' ',s,flags=re.S|re.I)
              s=re.sub(r'<div class="sources"\b.*?</div>',' ',s,flags=re.S|re.I)
              s=re.sub(r'<h[1-6]\b.*?</h[1-6]>',' ',s,flags=re.S|re.I)
              s=re.sub(r'<[^>]+>',' ',s); s=html.unescape(s)
              counts.append(len(re.findall(r"\b[\w’'-]+\b",s)))
          svg_refs=re.findall(r'<img[^>]+src="images/([^"]+\.svg)"',raw)
          drawio_refs=re.findall(r'href="images/([^"]+\.drawio)"',raw)
          q_match=re.search(r'const Q=\[(.*?)\];function sh',raw,re.S); q_block=q_match.group(1) if q_match else ''
          q_count=len(re.findall(r'\[(?:H|C|R|S),\d+,',q_block)); dist={k:len(re.findall(r'\['+k+r',\d+,',q_block)) for k in 'HCRS'}
          missing=[x for x in svg_refs+drawio_refs if not os.path.exists('docs/images/'+x)]
          bad_svg=[x for x in svg_refs if not open('docs/images/'+x,encoding='utf-8').read().lstrip().startswith('<svg')]
          bad_drawio=[x for x in drawio_refs if 'mxgraph.azure.' not in open('docs/images/'+x,encoding='utf-8').read()]
          forbidden=bool(re.search(r'<h3>\s*(Exam and interview takeaways|Summary)\s*</h3>',raw,re.I)); fullwidth='.diagram img{display:block;width:100%;height:auto}' in raw
          fonts=all(s in raw for s in ['font:14.5px/1.56','h1{font-size:30px','h2{font-size:23px','h3{font-size:18px','font-size:13px'])
          result={'report':path,'lesson_count':len(counts),'lesson_substantive_word_counts':counts,'minimum_lesson_substantive_word_count':min(counts) if counts else 0,'svg_refs':len(svg_refs),'drawio_refs':len(drawio_refs),'missing_assets':missing,'bad_svg':bad_svg,'bad_drawio':bad_drawio,'question_count':q_count,'domain_distribution':{'Hybrid connectivity and architecture':dist['H'],'Core networking infrastructure':dist['C'],'Routing and traffic management':dist['R'],'Security, monitoring, and private service access':dist['S']},'forbidden_sections':forbidden,'fullwidth_diagrams':fullwidth,'compact_typography':fonts}
          result['status']='PASS' if (len(counts)==12 and min(counts)>=700 and len(svg_refs)==12 and len(drawio_refs)==12 and not missing and not bad_svg and not bad_drawio and q_count==50 and dist=={'H':15,'C':13,'R':10,'S':12} and not forbidden and fullwidth and fonts) else 'FAIL'
          out='docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-06-08-01.validation.json'; open(out,'w',encoding='utf-8').write(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
      - name: Commit validated report and record
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-06-08-01.html docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-06-08-01.validation.json
          git diff --cached --quiet || git commit -m "Expand and validate Azure study report depth"
          git push
