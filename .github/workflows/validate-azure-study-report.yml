name: Validate Azure Daily Study Report
on:
  push:
    paths:
      - 'docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'
      - 'docs/images/**'
      - '.github/workflows/validate-azure-study-report.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate latest report
        shell: python
        run: |
          import glob, json, os, re
          from html.parser import HTMLParser

          files=sorted(glob.glob('docs/Azure_Networking_Specialty_Daily_Study_Quiz_*.html'))
          if not files:
              raise SystemExit('No report files')
          path=files[-1]
          raw=open(path,encoding='utf-8').read()

          class LessonParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_lesson=False; self.section_depth=0; self.skip_depth=0; self.words=[]; self.counts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if not self.in_lesson and tag=='section' and 'lesson' in a.get('class','').split():
                      self.in_lesson=True; self.section_depth=1; self.skip_depth=0; self.words=[]; return
                  if self.in_lesson:
                      self.section_depth+=1
                      if self.skip_depth:
                          self.skip_depth+=1
                      elif tag in {'h1','h2','h3','h4','h5','h6','pre','code','figure','script','style'} or (tag=='div' and 'sources' in a.get('class','').split()):
                          self.skip_depth=1
              def handle_endtag(self,tag):
                  if self.in_lesson:
                      if self.skip_depth: self.skip_depth-=1
                      self.section_depth-=1
                      if tag=='section' and self.section_depth==0:
                          text=' '.join(self.words)
                          self.counts.append(len(re.findall(r"\b[\w’'-]+\b", text)))
                          self.in_lesson=False
              def handle_data(self,data):
                  if self.in_lesson and self.skip_depth==0: self.words.append(data)

          p=LessonParser(); p.feed(raw)
          svg_refs=re.findall(r'<img[^>]+src="images/([^"]+\.svg)"',raw)
          drawio_refs=re.findall(r'href="images/([^"]+\.drawio)"',raw)
          q_match=re.search(r'const Q=\[(.*?)\];function sh',raw,re.S)
          q_block=q_match.group(1) if q_match else ''
          q_count=len(re.findall(r'\[(?:H|C|R|S),\d+,',q_block))
          dist={k:len(re.findall(r'\['+k+r',\d+,',q_block)) for k in 'HCRS'}
          missing=[x for x in svg_refs+drawio_refs if not os.path.exists('docs/images/'+x)]
          bad_svg=[x for x in svg_refs if not open('docs/images/'+x,encoding='utf-8').read().lstrip().startswith('<svg')]
          bad_drawio=[x for x in drawio_refs if 'mxgraph.azure.' not in open('docs/images/'+x,encoding='utf-8').read()]
          forbidden=bool(re.search(r'<h3>\s*(Exam and interview takeaways|Summary)\s*</h3>',raw,re.I))
          fullwidth='.diagram img{display:block;width:100%;height:auto}' in raw
          fonts=all(s in raw for s in ['font:14.5px/1.56','h1{font-size:30px','h2{font-size:23px','h3{font-size:18px','font-size:13px'])
          result={
            'report':path,
            'lesson_count':len(p.counts),
            'lesson_substantive_word_counts':p.counts,
            'minimum_lesson_substantive_word_count':min(p.counts) if p.counts else 0,
            'svg_refs':len(svg_refs),'drawio_refs':len(drawio_refs),
            'missing_assets':missing,'bad_svg':bad_svg,'bad_drawio':bad_drawio,
            'question_count':q_count,
            'domain_distribution':{'Hybrid connectivity and architecture':dist['H'],'Core networking infrastructure':dist['C'],'Routing and traffic management':dist['R'],'Security, monitoring, and private service access':dist['S']},
            'forbidden_sections':forbidden,'fullwidth_diagrams':fullwidth,'compact_typography':fonts
          }
          result['status']='PASS' if (result['lesson_count']==12 and result['minimum_lesson_substantive_word_count']>=700 and result['svg_refs']==12 and result['drawio_refs']==12 and not missing and not bad_svg and not bad_drawio and q_count==50 and dist=={'H':15,'C':13,'R':10,'S':12} and not forbidden and fullwidth and fonts) else 'FAIL'
          out='docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-06-08-01.validation.json'
          open(out,'w',encoding='utf-8').write(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
      - name: Commit validation record
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/Azure_Networking_Specialty_Daily_Study_Quiz_2026-09-06-08-01.validation.json
          git diff --cached --quiet || git commit -m "Record Azure study report validation"
          git push
